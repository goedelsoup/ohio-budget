id: appropriation-is-not-distribution
summary: >-
  The comparison document's dollar figures measure distribution to a recipient class, not
  appropriation authority. Across HB 96's FY2026 school funding, the two move in opposite
  directions at two of three transitions. They must never be differenced against each other.
context: |
  The `comparison` connector now reads LSC comparison documents, which supply the
  `stated_justification` that every `budget-action` node has carried `[open]` since genesis.
  Those documents also quote dollar figures, in `Fiscal effect:` sentences attached to
  provisions. The obvious next move is to reconcile those figures against the appropriation
  spreadsheet, and the obvious expectation is that they agree.

  They do not, and not by a rounding margin. Line item 200550, Foundation Funding — All
  Students, FY2026, against the comparison document's estimated allocation to traditional
  school districts:

    stage              ALI 200550 authority   auth delta   trad-district delta   direction
    Executive                       $8.425B
    As Passed House                 $8.519B     +$93.75M              +$132.4M   same
    As Passed Senate                $8.447B     -$71.64M                +$1.0M   OPPOSITE
    As Enacted                      $8.458B     +$10.50M               -$69.4M   OPPOSITE

  Every authority figure is [verified] from the as-enacted appropriation spreadsheet; every
  distribution figure is [verified] from the comparison document's own `Fiscal effect:` text.

  The explanation is not error in either source. ALI 200550 funds traditional districts *and*
  community schools, STEM schools, and joint vocational districts. The line item is the
  authority; the allocation to traditional districts is one slice of it. A chamber can raise
  the line and shift the split, or cut the line and hold one recipient class harmless, and
  both happened here — the Senate cut $71.6M of authority while leaving traditional districts
  $1.0M better off, which means the cut fell entirely on the other recipients of the same
  line.
decision: |
  The two figures are different quantities and are never differenced, summed, or reconciled
  against each other anywhere in this repository.

  Concretely:

  - `LscProvisionRow.position` stores the comparison document's prose **as written**. No
    amount is parsed out of it. A figure inside a position is the document's claim about
    distribution, not this repository's claim about authority.
  - `budget-action.amount_delta` continues to come from the appropriation spreadsheet alone.
  - `budget-action.stated_justification` comes from the comparison document alone.
  - A `budget-action` node whose description quotes a distribution figure must name it as
    such in the same sentence.

  This is the case the `gap` calculator already refuses to compute — a recipient slice against
  a whole line — arriving from a direction that was not anticipated. `gap` refuses when asked
  directly. Nothing was stopping a *node author* from doing the same subtraction by hand and
  committing the result as a verified figure, which is how this would actually have entered
  the corpus.
confirmed_by: |
  Recorded from the House and Senate amendments. The governor's veto message, committed
  afterwards, is a third independent instance and the first from the executive branch.

  Across all 67 vetoed items, not one struck an appropriation amount — and yet the vetoes moved
  money. Item 6 removed a set-aside directing 5% of State Share of Instruction to 90-credit-hour
  degree programmes and College Credit Plus pathways. Item 19 removed three dredging earmarks
  from the GRF Parks and Recreation line, with the administration redirecting the projects to
  the Waterways Safety Fund. Item 22 removed a bar on distributing line item 440672 to youth
  shelters that "promote or affirm social gender transition". [verified]

  Every line item total is unchanged by all three. An item-level diff of the bill before and
  after the veto returns nothing, while 5% of a multi-hundred-million-dollar appropriation
  changes destination.

  This is worth noting because it generalizes the decision beyond where it was drawn. The rule
  was written about *published estimates* disagreeing with appropriations. The veto message
  shows the same gap opening inside the statute itself: the amount and its distribution are
  separately amendable, by different actors, at different stages, and a corpus that tracks only
  amounts is blind to one of them.
third_failure_mode: |
  A third way the same error arrives, found when HB 33's comparison document reported a
  distribution to traditional school districts *larger* than the line item's authority — which
  is impossible, and therefore evidence that the programme draws on something the corpus was
  not modelling.

  **Foundation funding is three line items, not one.** ALI 200550 (GRF), 200612 (lottery, fund
  7017), and 200604 (fund 5VS0) all carry the identical name `Foundation Funding - All
  Students`. The corpus modelled only the first, which is 80.6% of the programme in FY2026.
  [verified]

  So the earlier two cases were about comparing a **recipient slice** or a **distribution
  estimate** against a whole line item. This one is about the line item itself being a slice —
  of a programme, by fund. The rule generalises accordingly: before differencing two figures,
  establish that they cover the same recipients, the same basis, **and the same funds**.

  What makes this one harder to see than the others is that nothing is mislabelled. Each of the
  three line items is correctly named and correctly coded. Matching on the name returns three;
  matching on the code returns one; and a corpus that models one of them under the programme's
  ordinary English name has quietly answered a question nobody asked.

fourth_instance_and_the_first_self_inflicted: |
  The fourth arrival of this error, and the only one where the corpus's own author committed it
  as `[verified]`.

  `medicaid-health-care-services-fy2020-actual` was seeded at $10,586,261,761.86 against an
  authority of $14,112,337,514, and the node reported a 25% underspend — the largest variance in
  the corpus — with a plausible explanation attached about federal match rates rising during the
  public health emergency. The explanation was invented to fit a number that was wrong.

  ALI 651525 appears on four rows of that workbook. One is the line item; three are a memorandum
  breakdown beneath the schedule — `- State`, `- Federal`, `- Total` — and the extraction took
  the Federal row:

      10,586,261,761.86  Federal
    +  3,525,731,926.06  State
    = 14,111,993,687.92  Total, and the line item

  The true FY2020 variance is $343,826.08, or 0.002%.

  **What found it was not review.** The claim reads well, the arithmetic is right, the source is
  committed and citable, and the explanation is the sort a reader nods at. It was caught because
  HB 166's and HB 110's actuals overlap on FY2020: they agreed to the cent on four line items and
  disagreed on the fifth by exactly the state share. Two sources covering one year is worth more
  than any amount of re-reading one.

  **Two guards, since the diagnosis has two halves.** `ExtractionReport` now reports
  `ambiguous_line_item_codes` — any code appearing under more than one name, which is the shape
  that makes selecting by code alone unsafe. And `ALITitle`, the unspaced header every
  with-actuals workbook uses for the name column, was never matched as an identity column, so
  every extracted row from those files carried an empty name. That is why the ambiguity was
  invisible: the thing that distinguishes the four rows was the one field not being read.

rationale: |
  The failure mode this closes is specific and quiet. Both figures are correct, both are
  citable to a committed primary source, and both are about foundation funding in FY2026. A
  reader with the spreadsheet in one hand and the comparison document in the other, trying to
  explain the House's +$93.75M with the document's +$132.4M, gets a $38.65M discrepancy and no
  indication that the question was malformed. The most likely response is to assume one source
  is stale and pick the other — which discards a real fact rather than resolving it.

  The opposite-direction cases are what make this worth a decision record rather than a code
  comment. Where both figures move the same way, an analyst who conflates them is wrong about
  magnitude. Where they move opposite ways, they are wrong about **who did what to whom**: the
  Senate reads as cutting school funding by $71.6M when what it did was cut other recipients
  and leave traditional districts marginally better off. That is not a smaller error of the
  same kind. It reverses the finding.

  Recording it also resolves an open question the corpus had already posed. The Senate
  amendment node asked whether the reduction reflected a different view of the phase-in
  schedule or of available revenue. It was neither. The Senate changed the disadvantaged pupil
  impact aid calculation — the weighting between reported and directly-certified economically
  disadvantaged ADM — which is a change to *who counts*, and it moved money between recipient
  classes rather than into or out of education. Both hypotheses the node offered were about
  the size of the pot. The answer was about its division.
