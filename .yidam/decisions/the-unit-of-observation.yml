id: the-unit-of-observation
summary: >-
  Every question this corpus asked about chamber behaviour was posed per biennium, where n=4 and
  will still be 4 in 2028. Asked per line item, where n is about 1,400, it answers at once — and
  the answer is about the process, not the chamber: at all three hand-offs, every actor is more
  likely to raise what its predecessor cut than what its predecessor raised. Twelve cells of
  twelve, sign test p = 0.0005. The mechanism is not what it looks like.
context: |
  [The leadership record](./leadership-and-the-anomalies.yml) ended by naming one surviving
  hypothesis: that a chamber which receives a lean introduced budget raises line items and one
  which receives a generous budget trims them.

  Tested the way every previous question here was tested — four biennium-level numbers against
  four others — it gives `r = -0.61` in exactly the hypothesised direction. [verified]

  That number is worthless, and it is worth being precise about why. With four observations the
  threshold for significance is about |r| = 0.95. A correlation of 0.61 on n=4 is what the
  Speaker alignment already was: a pattern of the right shape, arrived at honestly, carrying no
  information. Recording it would have repeated the error diagnosed one commit earlier.
decision: |
  **Stop asking questions about legislative behaviour at biennium granularity.** Ohio holds one
  biennium every two years. The corpus has four and will have five in 2028; no amount of
  extraction changes that, and a hypothesis that needs biennium-level variance is unanswerable
  for the lifetime of anyone reading this.

  Ask the same question per line item. Each biennium carries roughly 1,400 of them, and the
  chamber acts on each one separately.

  Restated that way — *given what the executive did to this line item, what did the chamber do
  to it?* — the answer arrives at once: [verified]

  | | executive raised it | executive cut it | gap | p |
  |---|---|---|---|---|
  | HB 166, Householder | 29/49 = 59.2% | 11/14 = 78.6% | +19.4pp | 0.22 |
  | HB 110, Cupp | 12/17 = 70.6% | 36/37 = 97.3% | +26.7pp | 0.0093 |
  | HB 33, Stephens | 35/206 = 17.0% | 18/28 = 64.3% | +47.3pp | <0.0001 |
  | HB 96, Huffman | 13/53 = 24.5% | 25/32 = 78.1% | +53.6pp | <0.0001 |
  | **pooled** | **89/325 = 27.4%** | **90/111 = 81.1%** | **+53.7pp** | **1.6e-23** |

  Cells are: of the line items the chamber moved, the share it moved **up**. Three of four
  biennia are individually significant and the fourth has n=63.

  **The House moves against the executive, line by line, under all four Speakers.** That is what
  the aggregate direction was tracking all along — a chamber handed a budget in which the
  executive raised 71.5% of line items will appear to be a cutting chamber, and one handed 50.1%
  will appear generous, without anybody's disposition entering into it.

  ## It is not the House. It is every hand-off.

  The same measurement at each remaining transition, pooled across the four biennia: [verified]

  | the actor | on what the previous actor raised | on what it cut | gap | p |
  |---|---|---|---|---|
  | House, answering the executive | 27.4% | 81.1% | +53.7pp | 1.6e-23 |
  | Senate, answering the House | 25.0% | 51.8% | +26.8pp | 1.7e-06 |
  | conference, answering the Senate | 54.4% | 93.9% | +39.5pp | 2.3e-09 |

  **All twelve biennium-by-stage cells point the same way** — every actor is more likely to raise
  a line item its predecessor cut than one its predecessor raised. On direction alone that is a
  sign test at p = 0.0005, before any of the individual gaps are counted.

  So this is a property of the process rather than of a chamber, a party or an officer. Each
  actor in the sequence reverses the one before it, and the reversal is measured on line items,
  not on totals — nothing here depends on which line items are large.
rationale: |
  ## The mechanism is not the obvious one

  "Raises what the executive cut" is also exactly what regression toward a line item's usual
  level looks like, and that would be an artefact rather than a behaviour. The discriminating
  test: if the chamber is pulling figures back toward what the last biennium actually enacted,
  its substitute should land **closer** to that level than the introduced figure did.

  | | line items moved | toward the previous level |
  |---|---|---|
  | HB 166 | 72 | 30.6% |
  | HB 110 | 66 | 53.0% |
  | HB 33 | 260 | 68.8% |
  | HB 96 | 100 | 51.0% |

  **It does not.** [verified] Three of four sit near a coin flip and the fourth moves *away*. The
  chamber reverses the executive's direction without returning to the status quo ante — it
  overshoots, undershoots, and lands past the old level about as often as short of it.

  So the anti-correlation is robust and its cause is open. Two candidates the corpus cannot yet
  separate: the chamber negotiates against a **total**, so a budget already raised throughout
  leaves room only in cuts; or the introduced figure is an opening position in a negotiation and
  is expected by both parties to be moved. Both predict the sign and neither predicts the
  distance, which is why the toward/away test does not distinguish them.

  The refutation above was run on the House. The Senate and conference behave the same way and
  the toward/away question has not been re-run for them — [open] whether either returns figures
  to the level its predecessor started from, or whether all three actors reverse without
  restoring.

  The conference column looked like a body splitting differences, and it is not. On the 753 line
  items where the chambers disagreed, the report lands exactly at the **Senate's** figure 77.2%
  of the time, at the House's 9.7%, and strictly between them on 6.2%. **By contested dollars
  those shares are 33.0%, 6.9% and 51.2%** — a majority of the disputed money is split, on 6% of
  the lines. [verified] Conference moves only 172 of those 753 — which is precisely the 57 + 115 the conditioning table above was
  computed over. It acts rarely, and when it acts it restores what the Senate cut. See
  [conference-committee](../corpus/actor/conference-committee.yml).

  ## Why this is a decision rather than a finding

  The finding is that the chamber answers the executive. The decision is about what to do with
  every future question of this kind, and it generalises past this one:

  **Count the observations before choosing the unit.** This corpus holds 4 biennia, 22 line
  items it models, roughly 1,400 line items per workbook, 630 nodes, and 15 fiscal years. A
  question framed against the smallest of those is unanswerable and will still produce a
  suggestive number, because four points can be fitted by anything. The
  [Speaker alignment](./leadership-and-the-anomalies.yml) survived three commits on exactly that
  basis.

  Nothing about the data changed between `r = -0.61` and `p = 1.6e-23`. The same four workbooks
  answered both. What changed was asking the question at a granularity the evidence actually has.

  ## Two things the write-up nearly got wrong

  **Which fiscal year counts.** A substitute sets both years of a biennium at once, so a line
  item's treatment is one decision and not two. Measured across every hand-off, a line item moved
  in year one moves the same direction in year two 83.6% of the time and the opposite direction
  2.4%. [verified] Pooling both years therefore roughly doubles n while adding about a sixth as
  much information. Moving this analysis into a library briefly did pool them, and the House
  counts went from 325 to 647 — the same data, twice as confident. The published figures were
  computed on the first year throughout and are unchanged; what was missing was any record that
  the choice had been made. It is now a named constant with the measurement behind it.

  **Every figure here was hand-typed into this file.** A percentage in prose is a claim about a
  computation with nothing checking it, which is the same shape as a `[verified]` claim about a
  source nobody re-reads — and this repository has been caught three times by exactly that. The
  analysis now lives in `stage_delta::process`, is emitted into `findings.json`, and a test
  asserts the pooled counts this record quotes. If the workbooks change or the partition moves,
  the test fails and names the record that needs editing.
