id: deflator-choice
summary: >-
  Constant-dollar figures use the BEA state and local government purchases deflator, base
  FY2025. Against CPI-U the choice moves a five-year growth rate by 0.4 points; against a
  sectorally different index it moves every series in the corpus by 8 to 14. Direction survives
  the choice and magnitude does not, so a real-terms figure is never quoted without its index.
context: |
  `real_dollars` shipped no index and refused every cross-period comparison, on the stated
  grounds that which index to use is a modelling decision rather than a technical detail. That
  was the right default while the corpus held figures for two fiscal years. It now holds a
  continuous FY2020-FY2026 series for five line items, and the refusal was blocking the
  question the sixteen-year window was chosen to answer.

  Two candidates were committed and both were computed rather than argued about:

  - **CPI-U**, all items, not seasonally adjusted. What households pay.
  - **BEA state and local government consumption expenditures and gross investment, implicit
    price deflator.** What state and local governments pay — weighted toward compensation,
    construction, and services rather than toward rent, groceries and petrol.
decision: |
  The **state and local government purchases deflator**, base **FY2025**, built from
  `.yidam/sources/price-index/fred-a829rd3q086sbea.csv` by averaging its quarterly observations
  onto Ohio's July-June fiscal year.

  Three reasons, in the order they should be weighed:

  1. **It measures what the buyer buys.** A state budget is spent overwhelmingly on salaries,
     medical services, and construction. Deflating it by a consumer basket asks what the money
     would have bought a household, which is a different question from what it bought the
     state.
  2. **It covers the corpus window.** FY2010 through FY2026, every year the corpus holds.
     CPI-U cannot cover FY2026 at all: BLS never published an October 2025 figure, and one
     missing month makes that fiscal year permanently unaverageable.
  3. **Quarterly observations land cleanly on a July-June year.** Four quarters in, four
     quarters averaged, no interpolation.

  Every restated figure carries the series name. `Real::label` renders
  `FY2025 dollars (state and local government … A829RD3Q086SBEA)` and not a bare number,
  because the choice is contestable and a constant-dollar figure without its index is not
  interpretable.

  Swapping it is a one-line change to `DEFLATOR_SOURCE` and `DEFLATOR_NAME` in `corpus-export`.
  Both series are committed so the alternative can be computed, not just imagined.
rationale: |
  The measurement is what settled it, and it settled it in an unexpected direction.

  Foundation funding, FY2020 to FY2025:

      nominal                  +19.1%
      real, CPI-U               -3.6%
      real, state and local     -3.2%

  **Deflation reverses the sign.** A line item that grew nineteen percent in dollars shrank
  about three and a half percent in purchasing power. Any account of Ohio school funding over
  this period that quotes the nominal figure is not describing the same thing as one that
  deflates, and the difference is not a nuance — it is the whole finding.

  Against that, the gap between the two candidate indices is 0.4 percentage points over five
  years, and never more than $28 million on a roughly $8 billion line in any single year.

  So the modelling worry that kept `real_dollars` empty — that the choice of index would
  materially change the answer — turns out to be much smaller than the thing it was protecting
  against. The refusal was still correct: it prevented nominal figures being charted as a trend,
  which is the error the skill names. But it was guarding the smaller of the two risks, and
  measuring both is what showed which was which.

  ## The 0.4 points do not generalise, and this record over-claimed

  That comparison was between **two general price indices** — CPI-U and state and local
  purchases — and the conclusion drawn from it, that the choice of index is the smaller risk,
  was stated without that qualification. It does not hold against a sectorally different index.

  A third series is now committed: the BEA health care chain-type price index, the direct
  sibling of the chosen deflator — same agency, same cadence, same construction. Every restated
  series in the corpus, under both: [verified]

  | line item | window | nominal | gov purchases | health care | spread |
  |---|---|---|---|---|---|
  | Foundation Funding | FY2012-FY2026 | +52.8% | +2.1% | +16.5% | 14.4 pts |
  | Medicaid Health Care Services | FY2014-FY2026 | +47.4% | +4.3% | +15.6% | 11.3 pts |
  | Institutional Operations | FY2020-FY2025 | +23.9% | +0.7% | +8.9% | 8.2 pts |
  | Local Government Fund | FY2012-FY2025 | -8.1% | -36.1% | -27.9% | 8.2 pts |
  | State Share of Instruction | FY2020-FY2026 | +6.8% | -16.6% | -8.8% | 7.8 pts |

  **Between eight and fourteen points, not four tenths of one.** The worry that kept
  `real_dollars` empty was right after all; measuring two general indices simply could not
  detect it.

  **What survives, and it is the part that matters.** The sign is identical under both indices
  on every series, and nominal exceeds real on every series under both. So the two conclusions
  this corpus actually rests on —
  [that nominal growth is mostly price level](./nominal-growth-is-mostly-price-level.yml), and
  that the local government fund and State Share of Instruction fell in real terms — do not
  depend on the choice. What depends on it is *how far*.

  The rule that follows: **a direction stated in real terms is robust here; a magnitude is not,
  and must not be quoted without its index.**

  [open] A per-line-item deflator is still not built, and this measurement makes the case for
  one weaker rather than stronger. Assigning an index per line item would need twenty-two
  defences and would bury the sensitivity inside whichever index was chosen; reporting both on
  every series costs one number and shows it. What a per-line-item index would genuinely help
  is a construction or debt-service line, where the right index is not arguable — and the
  corpus holds neither yet.

  [open] Health care prices are not Medicaid prices. Medicaid pays administered rates set by
  the state, not market rates, and the PCE index is weighted toward private spending. It is a
  sensitivity probe, not a better answer, and the corpus does not pick between them.
