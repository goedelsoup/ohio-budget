id: nominal-growth-is-mostly-price-level
summary: >-
  The deflator was applied to every enacted series the corpus holds. Two of five reverse sign,
  two more collapse to roughly flat, and only Medicaid grows materially in real terms. The
  finding recorded for foundation funding was not a special case — it is what this window does.
context: |
  [The deflator decision](./deflator-choice.yml) chose an index and demonstrated it on one line
  item: foundation funding grew 19.1% nominally and shrank 3.6% in real terms over FY2020-FY2025.
  That was recorded as the reason to deflate at all.

  It was demonstrated and then not applied. `gap::gap_trend` had taken a deflator argument since
  it was written, and no caller ever passed one. `corpus-export` built a `Deflator`, read its
  name and its covered periods into the manifest, and dropped the index itself — so
  `deflator_available: true` shipped beside figures that had never been restated.

  The web layer had a guard for exactly this, and the guard is what made it worse. `trendable()`
  refused to draw a series until a deflator existed; the day one existed it began returning the
  **nominal** points, and the caveat the pages had been printing disappeared. A reader who had
  seen "not drawn as a trend — no deflator is available" in one build saw an uncaveated table of
  FY2020-FY2026 dollars in the next. Nothing had been deflated. The gate had simply gone green.

  This is [claims about repository state](./claims-about-repository-state.yml) again, in a
  machine-readable field rather than in prose, and it survived longer because a boolean does not
  read as a claim.
decision: |
  Apply the index to every series the corpus holds, emit the restatements as findings with
  their own refusals, and state real figures wherever the corpus states nominal ones across
  periods.

  Concretely: `findings.real_terms` carries one restated enacted series per line item, and
  `findings.gap_trend` one comparison per adjacent period pair. Both carry the index name on
  every record. `trendable()` is gone; `realSeriesFor()` reads the answer rather than deciding
  it is permitted, because a deflator check that returns nominal figures is the failure it was
  written to prevent.

  **The result, FY2020 to the last year each series reaches, in FY2025 dollars:** [verified]

  | line item | nominal | real | |
  |---|---|---|---|
  | State Share of Instruction | +6.8% | **-16.6%** | reverses |
  | Foundation Funding | +21.8% | **-4.8%** | reverses |
  | Institutional Operations | +23.9% | +0.7% | collapses |
  | Local Government Fund | +27.0% | +3.3% | collapses |
  | Medicaid Health Care Services | +43.1% | +11.8% | survives |

  Two of five reverse direction. Two more grow by less than a percent a year, which on this
  window is indistinguishable from flat. One grows in real terms, and it is the one whose cost
  the legislature least controls.

  Seven of the corpus's twenty-two line items restate; the rest hold one figure or none. Five
  of twenty-four adjacent-period gap comparisons are refused, four because a biennial period
  label has no entry in an annually-keyed index and one because the later figure is `[open]`.
rationale: |
  The single-line-item result could have been a property of school funding — a formula keyed to
  enrollment and local capacity has its own reasons to lag prices, and one observation cannot
  tell that apart from a general effect. Applying the index to everything is what separates
  them. The five series have almost nothing in common: a school funding formula, a higher
  education completion formula, prison operations, a statutory share of tax receipts, and a
  federally matched entitlement. Their drivers are enrollment, degree completions, sentencing
  law, tax collections and caseload respectively, and four of the five still land within a
  percentage point a year of flat. A cause that indifferent to what the money is for is the
  price level.

  That makes the nominal figures in this corpus systematically misleading in one direction, and
  it is worth being plain about which: **every one of them overstates growth.** A reader who
  quotes an appropriation increase from this repository without deflating will be wrong by
  between five and twenty-three points, always the same way. That is not a caveat, it is a
  correction, and the corpus now prints both figures side by side rather than printing the
  nominal one and a warning.

  **What deflation cannot do,** recorded because the first instinct on seeing these numbers is
  to re-open every result that rests on a comparison: it cannot change a sign within a period.
  Deflating multiplies all of a period's figures by one positive number, so a stage delta, a
  gap variance, and a fund share are unaffected in direction and in ratio to each other. The
  [Speaker alignment](./leadership-and-the-anomalies.yml) is a table of signs and survives
  untouched. What changes is every comparison *between* periods — which is most of what a
  sixteen-year corpus is for.

  [open] One index for every line item, still. Medicaid is the series most likely to be wrong
  under it: medical prices did not move with government purchases over this window, and +11.8%
  is the number this corpus is least willing to defend. A medical care price index would test it
  and is not committed.

  [open] Four biennial period labels cannot be restated at all, because averaging two fiscal
  years into one index value is a modelling decision nobody has taken. They are the corpus's
  oldest figures — FY2010-11 through FY2018-19 — and they are exactly the ones a long series
  would want.
