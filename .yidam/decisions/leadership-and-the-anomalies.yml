id: leadership-and-the-anomalies
summary: >-
  The House substitute's direction on foundation funding splits exactly with the Speaker, and so
  does the Fair School Funding Plan's phase-in. Extending the test to all 1,400 line items kills
  both: the pattern appears just as strongly outside anything the plan touches, and the one
  officer who presides three times behaves three different ways. It is an era effect, not a
  person and not a policy.
context: |
  Two things the corpus measured turned out not to generalise, and both were recorded as
  patterns before a third biennium contradicted them:

  - **Chamber floors move no money** — true in HB 110, HB 33 and HB 96; false in HB 166, where
    the Senate floor moved two line items and the General Assembly's own record labels that vote
    `Passed - Amended`.
  - **The House raises school funding and the Senate takes part of it back** — true in HB 33 and
    HB 96, and reversed in HB 166 and HB 110.

  The obvious covariate is who was presiding. It is not derivable from appropriation data —
  presiding officers change on their own schedule, twice mid-General-Assembly in this window —
  so `speaker-of-the-house` and `president-of-the-senate` were seeded with dated occupancy.

  ## The alignment

  | GA | Budget | Speaker | Senate President | House sub | Senate sub | floor moves |
  |---|---|---|---|---|---|---|
  | 133rd | HB 166, FY2020 | Householder → Cupp | Obhof | **-$250.0M** | -$2.5M | **Senate, 2 items** |
  | 134th | HB 110, FY2022 | Cupp | Huffman | **-$154.5M** | **+$267.9M** | none |
  | 135th | HB 33, FY2024 | Stephens | Huffman | +$627.0M | -$173.8M | none |
  | 136th | HB 96, FY2026 | Huffman | McColley | +$92.3M | -$72.9M | none |

  All figures [verified]; leadership [verified] against a committed source.

  HB 166 was signed 18 July 2019 and Householder was removed 30 July 2020, so the whole of that
  bill's passage falls under him. Cupp's speakership covers HB 110 entire.

  **The House substitute's sign splits exactly with the Speaker.** Householder and Cupp cut
  foundation funding; Stephens and Huffman raised it. Two and two, no exceptions.

  Each House-substitute figure is stated in the dollars of its own biennium, so the column is
  four incomparable magnitudes. In FY2025 dollars they are **-$307.5M, -$167.8M, +$638.8M,
  +$88.7M**. [verified]

  This does not disturb the alignment, and it cannot: deflation multiplies a period's figures
  by one positive number, so no sign can change. It is recorded here because the natural next
  move on seeing a 2-2 split is to reach for magnitude — *Householder cut far harder than Cupp*
  — and that reach is a cross-period comparison. Nominally the FY2020 cut is 1.62 times the
  FY2022 one; in constant dollars it is 1.83 times. The ordering survives; the size of the
  claim does not.
decision: |
  Record the alignment. Do not treat it as a finding, and do not let a node assert that
  leadership explains any of it.

  Three reasons, and the third is the one that matters:

  1. **Four points.** Two per side. A coin lands this way half the time.
  2. **The Senate anomaly does not fit.** The one floor exception is under Obhof, who also
     presided over the 132nd — for which the corpus holds no stage series. There is one Obhof
     budget here and it is the one with the anomaly, so "this officer" and "this biennium"
     are the same hypothesis at present.
  3. **A confound of exactly the same shape.** The Fair School Funding Plan was enacted in
     HB 110 and phased in across the two budgets after it. The biennia where the House cut
     foundation funding are the biennia before the plan took hold; the ones where it raised are
     after. Speaker and plan-phase change together across this window, and nothing in four
     observations can tell them apart.

  **The test has now been run, and neither hypothesis survives it.**

  This record twice said the separating evidence was the 128th through 132nd General Assemblies
  — biennia before the plan existed — and was twice wrong. LSC published no stage columns before
  FY2020-21. [verified] It was looking along the wrong axis. The plan reaches school funding and
  nothing else, so the separating evidence is **more line items in the same biennia**, and every
  committed workbook from the 133rd on carries all nine stages for roughly 1,400 of them. The
  evidence was in hand the entire time.

  `crates/stage-delta/src/bin/leadership.rs` runs it. House substitute, share of moved line
  items **raised**, school funding against everything else, both fiscal years: [verified]

  | Speaker | school funding | everything else |
  |---|---|---|
  | Householder | 77.8% / 77.8% | 73.7% / 80.6% |
  | Cupp | 80.0% / 78.6% | 89.2% / 90.1% |
  | Stephens | 38.1% / 31.7% | 27.7% / 22.7% |
  | Huffman | 36.4% / 35.0% | 46.1% / 43.9% |

  **The two columns move together.** Householder and Cupp raised most of what they touched
  everywhere; Stephens and Huffman cut most of it everywhere. The Fair School Funding Plan
  cannot explain a pattern that appears just as strongly outside anything it can reach, so the
  confound this record was built around is **eliminated**.

  That leaves leadership — and the same run eliminates it too.
rationale: |
  The alignment is the most striking thing the corpus has produced and the least supported. That
  combination is exactly when a repository like this earns its keep or fails.

  Every other pattern recorded here was contradicted by extending the series: the floor result
  survived two biennia, the House-raises shape survived two, and both broke on the third and
  fourth. The base rate for "pattern found in a handful of Ohio budgets" is poor, and this one is
  drawn from fewer observations than either of the ones that already failed.

  The confound is what makes it worth a record rather than a footnote. If the Speaker hypothesis
  were merely underpowered, more data would settle it. But plan-phase moves with speakership over
  precisely these four biennia, so more data *of this kind* would not — every additional
  post-2021 budget adds a point to both explanations equally. The informative observations are
  the older ones, where the two come apart, and naming that is more useful than either asserting
  the correlation or dismissing it.

  ## Why the older biennia cannot settle it

  What LSC published, checked against the live site rather than assumed: [verified]

  | GA | bill | workbook | columns |
  |---|---|---|---|
  | 128th | HB 1, FY2010-11 | **none** | greenbooks and comparison documents, PDF only |
  | 129th | HB 153, FY2012-13 | budget in detail | 13 |
  | 130th | HB 59, FY2014-15 | budget in detail | 13 |
  | 131st | HB 64, FY2016-17 | budget in detail | 13 |
  | 132nd | HB 49, FY2018-19 | budget in detail | 13 |
  | 133rd | HB 166, FY2020-21 | **appropriation spreadsheet** | **25** |

  The thirteen are `Agency, Fund Group, Fund, ALI, ALI Title`, one prior-year actual, one
  estimate, **two appropriation columns**, and four sort keys. The twenty-five carry the nine
  stages in both fiscal years. There is no substitute column, no reported-by-committee column
  and no conference column anywhere before the 133rd — the figures do not exist in machine
  form because LSC did not publish them.

  Even the filename changes at the same boundary, from `budget-in-detail` to
  `appropriation-spreadsheet`. The rename tracks the format change exactly, which is as close
  to the publisher saying so as this is going to get.

  The comparison documents are not a way around it. They exist for all five General Assemblies
  and they do carry stage columns — but what stands in those columns is prose and per-pupil
  formula parameters, not line-item totals. HB 49's education document sets out
  `increases the formula amount to $6,020 in both years` under the House and `$6,010 in FY 2018`
  under the Senate; it never states what ALI 200550 stood at in either version. The corpus's
  existing stage series all came from the spreadsheets, and nothing else published carries them.
  The older documents also draw no column rules, so `lsc::comparison` refuses them outright —
  a second obstacle, and the smaller one, since a reader could be written and would still find
  no figures.

  ## Huffman presides three times and behaves three ways

  Matt Huffman is Senate President for the 134th and 135th General Assemblies and Speaker of the
  House for the 136th. He is the only officer this corpus observes more than once, and he is
  therefore the whole experiment. Share of moved line items raised: [verified]

  | | role | stage | share raised |
  |---|---|---|---|
  | HB 110 (134th) | Senate President | Senate substitute | 68.4% / 71.6% |
  | HB 33 (135th) | Senate President | Senate substitute | 37.5% / 35.3% |
  | HB 96 (136th) | Speaker | House substitute | 46.1% / 43.9% |

  Same person, same chamber, consecutive biennia — **68-72% raised, then 35-38%**. A personal
  disposition toward raising or cutting appropriations does not reverse between two adjacent
  budgets under the same officer. Whatever the four-point alignment is tracking, it is not who
  was presiding.

  What both halves point at is an **era effect**: the 133rd and 134th raise, the 135th and 136th
  cut, across both chambers, both parties' officers, and every part of the budget. Speaker,
  Senate President and plan-phase all change on that same boundary, which is why any of them
  looked explanatory on four observations.

  [open] The leading alternative is the shape of what the executive introduced — a chamber that
  receives a lean budget raises line items and one that receives a generous budget trims them,
  and the introduced column is in every workbook already. That is testable with what is
  committed and has not been tested.

  ## The claim that was wrong, and why it was attractive

  The claim that the test was reachable was wrong in a way worth naming, because it was
  attractive rather than careless. It made the record better: a confound honestly identified
  *and* a stated route to resolving it reads as more complete than a confound with no way out.
  Nothing was checked. One HTTP request to the LSC budget archive would have settled it, and
  the record shipped without one.

  The rule this suggests, and the corpus should hold itself to: **a claim that data is
  obtainable is a claim about the world, and takes the same evidence as a claim about a figure.**
  "The connector already handles this format" is checkable in about a minute and was treated as
  self-evident. Compare the neighbouring claims in this same record, every one of which was
  computed before it was written down.

  [open] What the 129th-132nd *can* supply is annual enacted appropriations for FY2012 through
  FY2019 — two per workbook, in a shape the classifier nearly reads already (it wants a bare
  `Appropriation FY20XX` label mapped to the enacted stage). That is not the leadership test.
  It is worth more than the leadership test: it would carry every real-dollar series back eight
  years, and it would convert the corpus's four biennial period labels — the ones the deflator
  cannot restate, per
  [nominal growth is mostly price level](./nominal-growth-is-mostly-price-level.yml) — into
  annual figures that it can. HB 153's workbook is served with an `.xlsx` extension and is a
  legacy OLE2 `.xls`; `calamine` refuses it, so that one needs a converter or another route.

  [open] The Speaker question therefore has no reachable test in the published record, and this
  record should stop implying one exists. Separating speakership from Fair School Funding Plan
  phase-in would need the stage figures reconstructed from bill text — the substitute bills
  themselves are published — which is a different and much larger connector than any here.
