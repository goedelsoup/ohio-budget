class: forecast
label: Medicaid Caseload Projection — FY2014-15
description: |
  Projected Medicaid enrollment for the biennium in which eligibility was extended to the
  expansion population. [inference]

  Seeded as the corpus's earliest caseload projection and its first test of a projection made
  under genuine uncertainty: nobody knew how many newly eligible Ohioans would enroll. Its
  variance is the cleanest available measure of how a major eligibility change was forecast, as
  distinct from how an economic shock was.
