  issued_date: "[open] pending the obm connector"
  projected_amount: "[open] pending the obm connector"
  horizon: |
    [open] Not reconstructed.
  variance_from_actual: |
    [open] Computable once extraction supplies both the projection and the outturn.
  assumptions: |
    [open] Not reconstructed.
