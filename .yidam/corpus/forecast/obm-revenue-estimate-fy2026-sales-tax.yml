class: forecast
label: Executive Revenue Estimate — FY2026, Sales and Use Tax
description: |
  The sales and use tax component of the executive revenue estimate underlying
  [HB 96](../bill/hb96-136th.yml). [inference]

  Seeded alongside the [income tax estimate](./obm-revenue-estimate-fy2026.yml) for the same
  period because forecast error is not uniform across instruments. Income tax is the more
  cyclically sensitive of the two, so a single-instrument view of forecast quality would
  systematically misstate it. Holding both is what lets the corpus eventually say which
  instrument the estimate got wrong, rather than only that the total missed.
properties:
