class: forecast
label: Medicaid Caseload Projection — FY2024-25
description: |
  Projected Medicaid enrollment for the FY2024-25 biennium. [inference]

  Seeded against a closed period, unlike the
  [FY2026 projection](./medicaid-caseload-fy2026.yml). That difference is the whole point: this
  one's variance from actual is computable, so it is the node that could establish whether the
  gap on the [FY2024-25 Medicaid appropriation](../appropriation/medicaid-health-care-services-fy2024-25-as-enacted.yml)
  is explained by caseload forecasting or by something else.

  It carries no `projects` edge. A caseload projection projects people, not money, and the edge
  targets a revenue instrument — the absence is correct rather than incomplete.
properties:
  forecast_type: caseload-projection
  issued_date: "[open] pending the obm connector"
  projected_amount: "[open] pending the obm connector"
  horizon: |
