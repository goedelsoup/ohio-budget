class: forecast
label: Executive Revenue Estimate — FY2012-13, Personal Income Tax
description: |
  The revenue estimate underlying [HB 153](../bill/hb153-129th.yml), issued as the state was
  emerging from the recession. [inference]

  Seeded because the local government fund reduction was justified at the time partly by the
  state's own fiscal position. [inference] Whether that position was as projected is a question
  this node makes answerable — and it is the difference between a reduction that responded to
  circumstances and one that was a policy preference given cover by them.
