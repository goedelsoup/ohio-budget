class: forecast
label: Executive Revenue Estimate — FY2022-23, Sales and Use Tax
description: |
  The sales tax estimate underlying [HB 110](../bill/hb110-134th.yml). [inference]

  Its interest is that it was made in early 2021, when consumption patterns were still
  disrupted and forecasting was unusually hard. [inference] Comparing its variance against the
  [FY2020-21 income tax estimate's](./obm-revenue-estimate-fy2020-income-tax.yml) would show
  whether the forecasting failure of the pandemic was concentrated in one instrument or general
  — a question with real implications for how much confidence any projection deserves.
