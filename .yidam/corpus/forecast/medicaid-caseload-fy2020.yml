label: Medicaid Caseload Projection — FY2020-21
description: |
  Projected Medicaid enrollment for the pandemic biennium. [inference]

  The projection most likely to have been wrong by the largest margin in the corpus window, and
  therefore the most informative once extracted. Enrollment rose sharply as employment fell, and
  federal continuous-coverage requirements changed disenrollment behaviour. [inference] Neither
  was foreseeable when the projection was made.
