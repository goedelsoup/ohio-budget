label: House Bill 49 (132nd General Assembly)
description: |
  The FY2018-19 main operating budget, and the last one enacted under ordinary economic
  conditions before the pandemic. [inference]

  Its practical role in the corpus is as a reference point. Comparisons spanning FY2020 are
  distorted by relief money and mid-year reductions on both sides, so a claim about how
  something has changed "since before the pandemic" is a claim about this biennium.

  [open] Not yet examined in detail.
