class: bill
label: House Bill 110 (134th General Assembly)
description: |
  The FY2022-23 main operating budget, which enacted the
  [Fair School Funding Plan](../program/fair-school-funding-plan.yml) and began its
  multi-biennium phase-in. [inference]

  It is the origin point for the corpus's central education thread. Because the plan phases in
  across subsequent biennia, every later budget makes a decision about it — which phase-in step
  to fund and which base year to compute against — and those decisions are the substance of
  school funding policy since. None of them appear as a cut.

  [open] The original phase-in schedule is unreconstructed, and without it no later budget's
  treatment can be assessed as on-schedule or not.
