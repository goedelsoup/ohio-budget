class: bill
label: House Bill 59 (130th General Assembly)
description: |
  The FY2014-15 main operating budget, which separated the
  [Department of Medicaid](../agency/department-of-medicaid.yml) from Job and Family Services.
  [inference]

  Seeded as the reorganization case. Ohio operating budgets restructure government as well as
  fund it, and this bill produced the corpus's largest organizational discontinuity — a whole
  program and its line items moving to a new agency code mid-window, breaking any code-keyed
  Medicaid series at FY2014.

  [open] Which line items moved, and whether the bill also carried the eligibility extension
  that changed caseload in the same biennium, are unreconstructed. The two are easily
  conflated and have entirely different implications for reading the series.
