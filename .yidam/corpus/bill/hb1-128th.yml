class: bill
label: House Bill 1 (128th General Assembly)
description: |
  The FY2010-11 main operating budget, enacted in July 2009 amid the sharpest revenue
  collapse of the corpus window. [inference] It relied substantially on one-time federal
  recovery money to close a gap that recurring revenue could not. [inference]

  It is the corpus's baseline period and its first structural-balance case. A budget balanced
  with non-recurring money is balanced in the constitutional sense and unbalanced in the
  structural one, and this bill is where that distinction first becomes concrete in the series.

  [open] The scale of the one-time money and how much of the gap it covered are
  unreconstructed.
