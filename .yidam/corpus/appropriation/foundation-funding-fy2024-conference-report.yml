class: appropriation
label: Foundation Funding — FY2024, Conference Report
description: |
  $7,967,250,000.00 at the conference report stage. [verified]

  +$261,000,000 — more than the House and Senate committee steps combined, and the figure
  that became law. Conference settled above both chambers' positions rather than between
  them, which the [conference committee](../actor/conference-committee.yml) node records as
  this stage's habit.

  One checkpoint in the corpus's second complete nine-stage series. The first,
  [FY2026 under HB 96](./foundation-funding-fy2026-conference-report.yml), could not be compared against
  anything until this one existed — which is what made the chamber-floor result a pattern
  rather than an observation about one bill.
