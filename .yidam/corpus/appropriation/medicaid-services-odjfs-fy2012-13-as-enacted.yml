class: appropriation
label: Medicaid Services (JFS) — FY2012-13, As Enacted
description: |
  Medicaid benefit authority for FY2012-13, appropriated to
  [Job and Family Services](../agency/job-and-family-services.yml) under the predecessor line
  item.

  This is the pre-separation half of the Medicaid series. Paired with the
  [FY2024-25 figure](./medicaid-health-care-services-fy2024-25-as-enacted.yml) under the
  successor line item, it demonstrates why lineage resolution is load-bearing: a code-keyed
  query would find no relationship between these two figures at all, and would report the
  earlier line as terminated and the later one as newly created.
