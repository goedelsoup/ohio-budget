class: appropriation
label: Local Government Fund Distribution — FY2024-25, As Enacted
description: |
  Local government fund distribution authority for FY2024-25.

  Completes the post-reduction half of the corpus's most important series. With FY2010-11
  through FY2024-25 now present, the question stops being whether the share was cut — that is
  settled — and becomes whether it was ever restored. A flat series after FY2013 answers it one
  way; a gradual recovery answers it another, and the two imply very different things about what
  the [FY2012-13 decision](../budget-action/hb153-local-government-fund-reduction.yml) actually
  was.
