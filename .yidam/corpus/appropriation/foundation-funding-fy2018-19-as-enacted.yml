class: appropriation
label: Foundation Funding — FY2018-19, As Enacted
description: |
  School funding authority for FY2018-19.

  One point in a continuous series. Its analytical value is not in the figure alone but
  in its position: a single biennium's number says nothing, and the series says what changed. With the FY2010-11 through FY2026 points now seeded, foundation funding is the first
  line item in the corpus with a continuous eight-biennium series — which is what
  [`real-dollars`](../../skills/real-dollars.md) and the phase-in question both need.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
