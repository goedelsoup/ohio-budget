class: appropriation
label: Foundation Funding — FY2024, Senate Substitute
description: |
  $7,705,750,000.00 at the senate substitute stage. [verified]

  -$173,800,000, taking back 28% of what the House had added. The same shape as HB 96 two
  years later, where the Senate reversed 79% of the House's increase.

  One checkpoint in the corpus's second complete nine-stage series. The first,
  [FY2026 under HB 96](./foundation-funding-fy2026-senate-substitute.yml), could not be compared against
  anything until this one existed — which is what made the chamber-floor result a pattern
  rather than an observation about one bill.
