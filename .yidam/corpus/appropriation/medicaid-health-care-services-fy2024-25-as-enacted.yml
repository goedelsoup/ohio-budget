class: appropriation
label: Medicaid Health Care Services — FY2024-25, As Enacted
description: |
  The general revenue share of Medicaid benefit authority for the FY2024-25 biennium.

  Seeded against a closed period so it can be differenced against
  [what was actually spent](../expenditure/medicaid-health-care-services-fy2024-25-actual.yml)
  using final rather than provisional figures. On this line item that difference is evidence
  about caseload forecasting rather than about spending discipline.

  Note this is the general revenue figure only. The
  [federal share](../line-item/medicaid-health-care-services-federal.yml) is a separate line
  item, and the all-funds total is roughly double this. [inference]
