class: appropriation
label: Institutional Operations — FY2020-21, As Enacted
description: |
  Prison operating authority for the pandemic biennium.

  Corrections is the corpus's slowest-moving cost driver, which makes it the control for the
  pandemic period: whatever happened to Medicaid and education spending in FY2020-21, prison
  population did not respond to the pandemic on the same timescale. [inference] A divergence
  here therefore says something different from a divergence in the others.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
