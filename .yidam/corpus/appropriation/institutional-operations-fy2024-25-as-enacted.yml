  likely to reflect genuine execution rather than forecasting or formula. Its paired
  [expenditure](../expenditure/institutional-operations-fy2024-25-actual.yml) carries a
  reversion, which makes this the corpus's first complete demonstration that authority granted
  can lapse unspent.
