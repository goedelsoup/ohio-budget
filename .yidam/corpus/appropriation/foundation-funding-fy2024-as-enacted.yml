class: appropriation
label: Foundation Funding — FY2024, As Enacted
description: |
  School funding authority for FY2024, appropriated by [HB 33](../bill/hb33-135th.yml).
  $7,967,250,000. [verified]

  Seeded because it completes the first computable gap in this repository. FY2024 is closed,
  its actual is published, and the authority behind it is in the budget that granted it — so
  for the first time both sides of the corpus's central question exist for the same line item
  in the same period.

  Note the [FY2024 actual](../expenditure/foundation-funding-fy2024-actual.yml) **exceeds**
  this figure, by $7,753,596.89. This node used to attribute that to the execution phase, on the
  reasoning that an enacted appropriation is not the last word. The real explanation is
  narrower and checkable.

  Foundation funding is [three line items](../line-item/foundation-funding.yml) across three
  funds. In FY2024 the other two — [lottery](./foundation-funding-lottery-fy2024-as-enacted.yml)
  and [5VS0](./foundation-funding-dpf-fy2024-as-enacted.yml) — spent their appropriations
  **exactly**, to the cent. [verified] The whole of the programme's $7,753,596.89 variance lands
  on this line.

  That is a property of how the programme is funded rather than of how it was managed: the
  non-general-revenue sources contribute fixed amounts into a formula-driven distribution, and
  general revenue absorbs whatever the formula produces. [inference] Reading the variance as a
  general revenue overspend attributes to one fund a movement that belongs to the programme.
