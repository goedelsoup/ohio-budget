class: appropriation
label: Foundation Funding — FY2026, Conference Report
description: |
  The reconciled FY2026 figure both chambers voted on, before the governor acted.

  This is the legislature's final position on school funding for the year. Differenced against
  the [enacted figure](./foundation-funding-fy2026-as-enacted.yml), the remainder is by
  definition the executive's edit and nothing else — which is the only clean way the corpus can
  isolate a veto's effect on a specific line.
  The conference report settled at $8,457,598,772 for FY2026, $10,500,000 above the Senate
  and $61,138,202 below the House. [verified]
