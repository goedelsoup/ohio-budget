class: appropriation
label: State Share of Instruction — FY2024-25, As Enacted
description: |
  Higher education operating subsidy authority for the FY2024-25 biennium.

  Seeded as a formula line whose formula points the opposite way from school funding's — toward
  institutions that produce more completions rather than toward those with weaker local
  capacity. Its [gap](../../skills/gap.md) against actual should behave differently again from
  Medicaid's and from corrections', which is the point of holding all three.
