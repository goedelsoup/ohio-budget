label: Public Library Fund Distribution — FY2010-11, As Enacted
description: |
  The pre-reduction public library fund figure.

  The *before* half of the library pair, matching the
  [local government fund's](./local-government-fund-distribution-fy2010-11-as-enacted.yml).
  Having both pairs is what allows the two reductions to be compared as proportions — and
  therefore what distinguishes a general shift of weight onto local entities from a targeted
  cut to one of them.
