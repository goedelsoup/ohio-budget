class: appropriation
label: Local Government Fund Distribution — FY2013, As Enacted
description: |
  $348,000,000.00 for line item 110969 in FY2013, appropriated by
  [HB 153](../bill/hb153-129th.yml). [verified]

  From the column HB 153's workbook heads `Appropriation FY 2013`. Unlike every later
  workbook, these name no stage; that the column is the enacted figure was established against
  the same biennium's OAKS adjusted-appropriation sheet rather than assumed. See
  [the catalog entry](../../catalog/lsc-hb153-budget-in-detail.md).

  **The cut, in the one place it is visible.** FY2012 carried $577,000,000 and FY2013 carries
  $348,000,000 — a fall of $229,000,000, or 39.7%, inside a single biennium. [verified]

  A biennial node would have recorded $925,000,000 for FY2012-13 and shown nothing at all. The
  step is the whole point of holding this line item, and it was invisible until the period was
  split.

  As the [line item](../line-item/local-government-fund-distribution.yml) says, this is not a
  decision about an appropriation. It is the arithmetic consequence of the statutory percentage
  [HB 153 changed](../budget-action/hb153-local-government-fund-reduction.yml), and the decision
  is in the bill's language rather than in this figure.

