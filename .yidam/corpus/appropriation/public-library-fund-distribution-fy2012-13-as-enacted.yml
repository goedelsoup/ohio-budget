description: |
  The public library fund figure for the biennium in which its share was reduced alongside
  the [local government fund's](./local-government-fund-distribution-fy2012-13-as-enacted.yml).
  [inference]

  Seeded so the two reductions can be compared rather than each read alone. If both shares fell
  by similar proportions, the event was a general shift of weight onto local entities; if one
  fell much further, it was targeted. Those are different claims about the same budget, and only
  the pair distinguishes them.
