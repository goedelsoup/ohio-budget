class: appropriation
label: State Share of Instruction — FY2026, As Enacted
description: |
  Higher education subsidy authority for FY2026, giving the completion-weighted formula a
  current-period point to sit alongside its
  [FY2024-25 predecessor](./state-share-of-instruction-fy2024-25-as-enacted.yml).
  Enacted at $2,156,383,406 for FY2026. Roughly a quarter of foundation funding, which is
  the scale relationship between the state's higher and primary-secondary education
  commitments. [verified]
