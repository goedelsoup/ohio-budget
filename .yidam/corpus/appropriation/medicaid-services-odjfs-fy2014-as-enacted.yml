class: appropriation
label: Medicaid Services (ODJFS) — FY2014, As Enacted
description: |
  **$0.00** for line item 600525 in FY2014. [verified]

  Zero is a figure here, not an absence. [HB 59](../bill/hb59-130th.yml) retained the Job and
  Family Services Medicaid line item and appropriated nothing to it, while ALI 651525 under the
  new `MCD` agency carried the money — $13,701,114,114 in FY2014 and $14,599,795,041 in FY2015.

  That is what makes the
  [agency transfer](../budget-action/hb59-medicaid-agency-transfer.yml) checkable in one
  document rather than inferred from two. A line item that simply disappeared between
  workbooks would be consistent with a transfer, a repeal, or an extraction failure; one
  carried forward at zero beside its successor is consistent with only the first.

  Its item number survives the move: 600**525** under `JFS` becomes 651**525** under `MCD`.
  [verified] The corpus does not generalise from a single case — [open] whether Ohio's ALI
  numbering preserves the item across an agency change as a rule is unestablished, and the
  [lineage](../../../crates/lineage/) calculator exists to raise exactly this question.
