description: |
  $2,039,394,850.00 for line item 235501 in FY2021, appropriated by [HB 166](../bill/hb166-133rd.yml).
  [verified]

  Against the $2,037,149,490.00 actually spent, a variance of $2,245,360.00 — 0.11%. [verified]

  One year of a seven-year series for this line item, FY2020 through FY2026. The series exists
  because four biennia of LSC workbooks are committed here and they overlap: each carries
  appropriations for its own years and actuals for earlier ones, so a year is usually stated
  twice by different publications.
