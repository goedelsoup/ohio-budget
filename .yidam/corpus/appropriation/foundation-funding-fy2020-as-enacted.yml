class: appropriation
label: Foundation Funding — FY2020, As Enacted
description: |
  $6,942,880,845.00 for line item 200550 in FY2020, appropriated by
  [HB 166](../bill/hb166-133rd.yml). [verified]

  FY2020 spending came in $255,088,619.56 under authority, 3.7%. The year ran to 2020-06-30 and schools closed statewide that March, so a formula-driven distribution measured against a pre-pandemic appropriation is not measuring ordinary execution. [inference]

  From the column HB 166 heads `As Enacted after Governor's Vetoes` — the workbook that
  settled whether LSC's enacted figure is taken before or after the executive acts. It is
  after. See [the catalog entry](../../catalog/lsc-hb166-appropriation-spreadsheet.md).
