class: appropriation
label: Medicaid Health Care Services — FY2016-17, As Enacted
description: |
  General revenue Medicaid authority for FY2016-17.

  Extends the post-separation Medicaid series. Read together with the
  [pre-separation figure](./medicaid-services-odjfs-fy2012-13-as-enacted.yml), the full series
  spans the agency reorganization — but only through an asserted lineage edge, so any trend
  drawn across it inherits that assertion's uncertainty.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
