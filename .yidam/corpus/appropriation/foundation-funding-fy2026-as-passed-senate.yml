class: appropriation
label: Foundation Funding — FY2026, As Passed by the Senate
description: |
  The Senate's FY2026 figure for [foundation funding](../line-item/foundation-funding.yml).

  Together with the [conference](./foundation-funding-fy2026-conference-report.yml) figure it
  breaks the corpus's largest attribution gap into steps. Previously the distance between the
  House-passed and enacted amounts covered Senate action, conference reconciliation, and the
  governor's vetoes as one undifferentiated movement.
  The Senate passed $8,447,098,772 for FY2026 — below the House's $8,518,736,974, and above
  the executive proposal. [verified]
