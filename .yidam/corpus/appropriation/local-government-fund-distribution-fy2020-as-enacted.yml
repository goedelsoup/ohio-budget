class: appropriation
label: Local Government Fund Distribution — FY2020, As Enacted
description: |
  $417,300,000.00 for line item 110969 in FY2020, appropriated by
  [HB 166](../bill/hb166-133rd.yml). [verified]

  FY2020 spending came in $23,653,468.80 under authority, 5.7%. This line distributes a share of state tax receipts, so a shortfall against appropriation is largely a shortfall in the receipts themselves. [inference]

  From the column HB 166 heads `As Enacted after Governor's Vetoes` — the workbook that
  settled whether LSC's enacted figure is taken before or after the executive acts. It is
  after. See [the catalog entry](../../catalog/lsc-hb166-appropriation-spreadsheet.md).
