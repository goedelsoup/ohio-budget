class: appropriation
label: Foundation Funding — FY2025, As Enacted
description: |
  $8,269,497,000.00 for line item 200550 in FY2025, appropriated by
  [HB 33](../bill/hb33-135th.yml). [verified]

  Identical to the 'Adjusted Appropriation FY 2025' the actuals workbook reports as of 2024-09-30, so no execution-phase change had touched this line by that date. [verified]

  Replaces the FY2024-25 biennium node this line item used to carry. No source states a
  biennium figure — HB 33's workbook gives FY2024 and FY2025 in separate columns, and every
  actual is annual — so the biennium node was a shape nothing supported and its amount stayed
  `[open]` for want of a figure that does not exist. See
  [period-granularity](../../decisions/period-granularity.yml).
