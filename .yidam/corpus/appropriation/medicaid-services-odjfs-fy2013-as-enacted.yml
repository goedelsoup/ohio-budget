class: appropriation
label: Medicaid Services (ODJFS) — FY2013, As Enacted
description: |
  $13,118,813,544.00 for line item 600525 in FY2013, appropriated by
  [HB 153](../bill/hb153-129th.yml). [verified]

  From the column HB 153's workbook heads `Appropriation FY 2013`. Unlike every later
  workbook, these name no stage; that the column is the enacted figure was established against
  the same biennium's OAKS adjusted-appropriation sheet rather than assumed. See
  [the catalog entry](../../catalog/lsc-hb153-budget-in-detail.md).

  The last year this line item carried money. In HB 59 it is still present under agency `JFS`
  and stands at **$0.00 in both FY2014 and FY2015**, while ALI 651525 under the new `MCD` agency
  carries $13,701,114,114 and $14,599,795,041. [verified]

  The predecessor was retained at zero rather than deleted, which is what makes the succession
  checkable in a single document rather than inferred from two.

