class: appropriation
label: Foundation Funding — FY2026, As Introduced
description: |
  The executive proposal's FY2026 figure for
  [foundation funding](../line-item/foundation-funding.yml), as stated in
  [HB 96 as introduced](../bill-version/hb96-as-introduced.yml).

  This node is the baseline for every subsequent claim about what happened to school funding in
  the FY2026-27 budget. It represents what the executive proposed before any legislative
  rewriting — which, for a formula program mid-phase-in, is chiefly a statement about which
  phase-in step and which base year the executive chose to fund. [inference] Those choices are
  more consequential than the dollar figure itself, and they are not visible in the figure.

  The executive proposed $8,424,986,974 for FY2026. [verified]

  This node carried a stale `[open]` line directly above that figure, saying the amount was
  unfilled and would be found in the comparison document. It was wrong twice: the amount had
  been filled from the appropriation spreadsheet several commits earlier, and the comparison
  document does not carry per-line-item amounts at any stage. The claim survived because
  nothing reads a node's prose against its own properties.
