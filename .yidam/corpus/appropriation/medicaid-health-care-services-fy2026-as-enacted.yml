class: appropriation
label: Medicaid Health Care Services — FY2026, As Enacted
description: |
  The enacted FY2026 general revenue figure for
  [Medicaid health care services](../line-item/medicaid-health-care-services.yml), as stated in
  [HB 96 as enacted](../bill-version/hb96-as-enacted.yml).

  This node exists to make a point the foundation funding chain cannot make: for
  [Medicaid](../program/medicaid.yml), the appropriation is closer to an estimate than to a
  limit. [inference] Cost follows enrollment and federal match, neither of which the General
  Assembly controls within a biennium, so a divergence between this figure and actual spending
  is evidence about forecasting rather than about spending discipline. The same divergence on
  foundation funding would mean something entirely different.

  This is why [`gap`](../../skills/) results must be read against the line item's character
  rather than uniformly. A single calculator produces the number; interpreting it requires
  knowing whether the line item is discretionary, formula-driven, or entitlement-driven.

  Enacted at $20,192,404,766 for FY2026 in general revenue — roughly 2.4 times foundation
  funding, and the largest single general revenue line item in the corpus. [verified]

  A general revenue figure for this line item is roughly half the all-funds figure, since
  federal match flows through separate accounts; quoting one for the other is the most common
  Medicaid reporting error. [inference] The figure above is general revenue, and the sheet it
  came from is named in `source_document` so the two cannot be confused.

  A stale `[open]` saying the amount was unfilled sat above that verified figure until the
  validator gained a rule for the contradiction.
