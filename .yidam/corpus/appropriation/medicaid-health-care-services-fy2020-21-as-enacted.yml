class: appropriation
label: Medicaid Health Care Services — FY2020-21, As Enacted
description: |
  General revenue Medicaid authority for FY2020-21.

  Extends the post-separation Medicaid series. Read together with the
  [pre-separation figure](./medicaid-services-odjfs-fy2012-13-as-enacted.yml), the full series
  spans the agency reorganization — but only through an asserted lineage edge, so any trend
  drawn across it inherits that assertion's uncertainty.

  The expansion population's costs and the pandemic's enrollment surge both land in this
  biennium. [inference] A gap here reflects two forecasting failures at once.
