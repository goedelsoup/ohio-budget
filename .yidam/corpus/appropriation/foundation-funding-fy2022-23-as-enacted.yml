class: appropriation
label: Foundation Funding — FY2022-23, As Enacted
description: |
  The FY2022-23 biennial figure, appropriated by [HB 110](../bill/hb110-134th.yml) — the
  budget that enacted the [Fair School Funding Plan](../program/fair-school-funding-plan.yml).

  This is the first point in the formula's phase-in and therefore the origin of the education
  series. Every later foundation funding figure is on-schedule or behind relative to what this
  bill set out, and that comparison cannot be made from amounts alone: it needs the schedule,
  which lives in [bill language](../bill-version/hb110-as-enacted.yml) rather than in a
  comparison table.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
