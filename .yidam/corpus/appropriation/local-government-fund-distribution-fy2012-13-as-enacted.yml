class: appropriation
label: Local Government Fund Distribution — FY2012-13, As Enacted
description: |
  The first biennial local government fund figure after the share was reduced by
  [HB 153](../bill/hb153-129th.yml).

  The *after* half of the corpus's most important pair. The critical point for anyone reading
  it: the decline recorded here was not a decision about this appropriation. It is the
  arithmetic consequence of a changed statutory percentage, and the decision is in the bill's
  language. An extraction that captures this figure and not that percentage records the effect
  with no cause attached.
