class: appropriation
label: Medicaid Health Care Services — FY2020, As Enacted
description: |
  $14,112,337,514.00 for line item 651525 in FY2020, appropriated by
  [HB 166](../bill/hb166-133rd.yml). [verified]

  FY2020 spending came in **$3,526,075,752.14 under** authority — 25.0%, by far the largest variance the corpus has measured. The federal match rate rose during the public health emergency, which moves cost off the general revenue share without reducing what the programme spent. [inference] Read as a general revenue underspend it looks like a collapse in Medicaid; it is not.

  From the column HB 166 heads `As Enacted after Governor's Vetoes` — the workbook that
  settled whether LSC's enacted figure is taken before or after the executive acts. It is
  after. See [the catalog entry](../../catalog/lsc-hb166-appropriation-spreadsheet.md).
