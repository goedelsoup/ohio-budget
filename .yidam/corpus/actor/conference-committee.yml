class: actor
label: Conference Committee
description: |
  The joint committee that reconciles House and Senate versions of an appropriation bill and
  produces the text both chambers vote on.

  It is the least documented actor in the process and the one that most often decides the final
  number. [inference] Conference changes appear in the report rather than in a committee record
  comparable to the chambers', so attributing a change to this role is frequently possible while
  attributing a *reason* is not.

  That asymmetry is worth recording as a property of the domain rather than a gap in the corpus.
  The [`stated_justification`](../budget-action.ont.yml) field will often be legitimately empty
  for conference-stage actions, and an empty justification here means something different from
  an unextracted one.

  **And it matters more than expected.** This role carries 15.3% of HB 96's total movement
  across 79 line items — comparable to the Senate substitute's 17.0%. [verified]

  It is the last stage at which any appropriation figure changes **in HB 96 and HB 33** — which
  holds on those bills' [veto messages](../../catalog/governor-hb96-veto-messages.md), where none
  of the governor's 67 and 44 items struck an amount. [verified] The claim was asserted here from
  the spreadsheet's columns first, withdrawn when the columns turned out unable to support it,
  and restored on the messages.

  **It does not hold in HB 166**, where the governor struck a $45 million line item after
  conference reported it — see [governor](./governor.yml). So this role is the last to move a
  figure in two of the three biennia the corpus has measured, and the exception is the executive
  rather than anything legislative.

  Even where it holds, it holds only for figures. Vetoes moved money *within* line items — a 5%
  set-aside on State Share of Instruction, three dredging earmarks, a recipient restriction —
  so "last to move a figure" and "last to move money" are different claims. [verified]

  What was true regardless: among the legislative stages this is the last one that moves money,
  and it is the least documented of them. Where the chambers leave a record of committee
  deliberation, this stage produces a report and a vote.

  ## Where it lands, by line and by dollar

  Across all four biennia, on every line item where the House-passed and Senate-passed figures
  disagree — 751 of them — the conference report lands: [verified]

  | | line items | share of lines | share of contested dollars |
  |---|---|---|---|
  | exactly at the **Senate's** figure | 581 | **77.4%** | **45.6%** |
  | exactly at the House's figure | 73 | 9.7% | 9.6% |
  | strictly between the two | 46 | 6.1% | 38.1% |
  | outside both | 51 | 6.8% | 6.7% |

  "Contested dollars" is the size of the House-Senate gap on each line, which is the quantity
  conference actually has to resolve.

  **The Senate's figure leads on both measures**, and the median position is 0.00 — the Senate's
  number — in all four General Assemblies separately, on a scale where 0 is the Senate's figure
  and 1 is the House's.

  What the dollar column adds is concentration rather than reversal. The forty-six line items
  conference splits are 6.1% of the contested set and carry 38.1% of the contested money — six
  times their share. Conference is selective: small disagreements are left at the Senate's
  figure, and the large ones are negotiated to a number neither chamber proposed.

  **An earlier version of this section said the opposite** — that a majority of contested dollars
  landed strictly between the chambers, and that counts and dollars told opposing stories. That
  rested on grand-total rows being read as line items. Every workbook carries between one and six
  rows with no ALI code — `Grand Total`, `Total All Funds`, `GRF State Total` — and each one's
  movement is the sum of every line item's. They shifted the split share from 38.1% to 51.2% and
  changed nothing about the counts, which is why the error survived a check of the line figures.

  ### Reconciling that with the conditioning result

  [The unit of observation](../../decisions/the-unit-of-observation.yml) records that conference
  raises 94.7% of the line items the Senate cut, which sounds like a body that overturns the
  Senate constantly. Both are true and they are the same 170 line items: conference **moves**
  only 22.6% of contested lines, and 751 − 581 = 170 is exactly the count that measurement was
  taken over.

  So the three together say something none says alone. **Conference acts on few lines, acts on
  the big ones, and acts in one direction**: it leaves three-quarters of contested figures where
  the Senate put them, the ones it moves carry a disproportionate share of the disputed money,
  and where it moves them it is almost always to restore something the Senate cut.

  [open] The Senate-passed text is the operative version entering conference, so a report landing
  at the Senate's figure is conference declining to disturb the bill rather than choosing between
  two candidates. That is a weaker claim than "the Senate wins" and the data cannot separate them
  — but it is not vacuous either, because reverting to the House figure is available and is taken
  on 9.7%. What the corpus can say is that the House's position is the one that has to be argued
  back in, and usually is not.
