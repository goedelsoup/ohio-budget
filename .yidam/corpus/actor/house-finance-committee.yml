class: actor
label: House Finance Committee
description: |
  The standing committee of the Ohio House of Representatives that takes the executive budget
  proposal first and rewrites it. It is seeded because the largest single set of changes to
  any Ohio operating budget typically occurs between the as-introduced and as-passed-by-House
  versions, [inference] which makes this role the highest-yield target for the
  [`stage-delta`](../../skills/) calculator.

  Modeling the committee as a role rather than as a body has a specific payoff here: committee
  membership and chairmanship turn over across the sixteen-year window, but the role's
  position in the sequence does not. Actions attributed to it remain comparable across
  General Assemblies.

  **Answered for FY2026.** Measured across all 1,528 line items in HB 96, the House substitute
  carries 51.3% of the bill's total movement — $4.18 billion gross — against the Senate
  substitute's 17.0%. House-stage changes are larger, and by a wide margin. [verified]

  A second result was not anticipated: **the House floor changed nothing at all.** Between the
  committee-reported version and the version passed by the House, zero line items and zero
  dollars moved. Every figure this chamber altered, it altered in committee.

  That reframes the role. The corpus modelled it as the body that rewrites the executive
  proposal, and it is — but the rewriting is finished before the floor sees it, so a reader
  comparing the introduced and passed versions gets the right answer for the wrong reason.

  **It holds in the previous biennium too, and the claim that this could not be tested was my
  own error.** Measured across all 1,586 line items in HB 33: [verified]

  | transition | FY2024 | FY2025 |
  |---|---|---|
  | introduced → House substitute | 43.3% | 51.1% |
  | House substitute → House reported | 4.7% | 2.3% |
  | House reported → **as passed by House** | **0.0%, 0 items** | **0.0%, 0 items** |
  | as passed House → Senate substitute | 35.9% | 35.8% |
  | Senate substitute → Senate reported | 1.7% | 1.7% |
  | Senate reported → **as passed by Senate** | **0.0%, 0 items** | **0.0%, 0 items** |
  | as passed Senate → conference report | 14.4% | 9.0% |
  | conference report → as enacted | 0.0% | 0.0% |

  Two biennia, four fiscal years, 3,114 line items: **not one dollar moved on either chamber's
  floor.** Every figure both chambers changed, they changed in committee.

  This node previously recorded the question as blocked, on the grounds that HB 33's
  spreadsheet carried enacted columns only and LSC had changed format between General
  Assemblies. That was wrong. The workbook has three sheets — `Final`, `EN`, `ENGRF` — and I
  read `Final`, the nine-column summary, then generalised from it to the workbook. `EN` carries
  all sixteen stage columns, and had done since it was committed. See
  [the catalog entry](../../catalog/lsc-hb33-appropriation-spreadsheet.md).

  **A third biennium breaks the result — though not for this chamber.** HB 166, FY2020-21, measured across all 1,371 line items: the
  House floor still moved nothing, but the **Senate floor did**. [verified]

  | | HB 166 FY2020 | HB 166 FY2021 |
  |---|---|---|
  | House reported → as passed by House | 0 items | 0 items |
  | Senate reported → **as passed by Senate** | **2 items, +$11.1M** | **1 item, +$0.1M** |

  Lupus Awareness (ALI 440481, Health) gained $100,000 on the Senate floor in each year, and
  Local Disaster Assistance (ALI 763511, Public Safety) gained $11,000,000 in FY2020.

  So the finding is narrower than two biennia suggested: chamber floors *rarely* move money and
  the House floor has moved none in three bills, but "the floors change nothing" is false. Two
  observations agreeing is a weaker thing than it feels like, and the corpus recorded it as a
  pattern one biennium before it had a counterexample.

  **[open] Whether the floor result tracks chamber leadership is unmeasured, and is the next
  thing to ask of it.** The one counterexample so far sits in the 133rd General Assembly; the
  two bills where both floors moved nothing are the 135th and 136th. Three points is not
  enough to see a pattern, but it is enough to know which covariate to record — and presiding
  officers change on a schedule that has nothing to do with fiscal years, so the question
  cannot be answered from the appropriation data alone.

  The `held_by` property on this node is where that belongs. It currently says only that
  membership and chairmanship turn over by General Assembly, which is exactly the kind of
  placeholder that stops a question being asked. What it needs is a dated succession: who
  presided, over which General Assembly, and which budget bill fell in their term.

  Note the counterexample is on the **Senate** floor, so the presiding officer that matters
  for it is the Senate President rather than the Speaker. Both are unmodelled — neither is an
  `actor` in this corpus yet — and seeding them is a prerequisite rather than an aside.

properties:
  name: House Finance Committee
  role_type: committee
  authority_basis: |
    House rules; the chamber's constitutional role in originating and amending appropriation
    bills. [inference]
  held_by: |
    Membership and chairmanship turn over by General Assembly. [open] Not yet reconstructed.
  phase_active: legislative — first chamber
