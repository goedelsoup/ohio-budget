class: actor
label: Senate Finance Committee
description: |
  The standing committee of the Ohio Senate that takes an appropriation bill after the House
  has passed it and produces the Senate's version.

  Seeded to make the middle of the legislative chain visible. The corpus previously held the
  [House committee](./house-finance-committee.yml) and the
  [governor](./governor.yml) but nothing between them, so every change between House passage
  and enactment was attributable only in aggregate. The Senate's revisions are frequently
  substantial and pull in different directions from the House's on the same items. [inference]

  **Answered for FY2026.** Senate-stage changes are smaller: 17.0% of the bill's total movement
  against the House substitute's 51.3%. [verified] But the Senate touched *more* line items —
  213 against 136 — so it made many smaller adjustments where the House made fewer larger ones.
  Magnitude and breadth point opposite ways, and either alone would mislead.

  The Senate floor, like the House floor, changed nothing: zero line items between the reported
  and passed versions. [verified] Both chambers finish their work in committee.

  **It holds in the previous biennium, and this role was larger there than here.** In HB 33 the
  Senate substitute carries 35.9% of FY2024's movement and 35.8% of FY2025's, against the House
  substitute's 43.3% and 51.1%. [verified] In HB 96 the same comparison was 17.0% against
  51.3%. So the Senate's share of the rewriting is not a stable property of the role — it
  roughly doubled between the two biennia while the House's stayed near half.

  The floor result is stable where the magnitudes are not: across both bills and all four
  fiscal years, zero line items and zero dollars moved between the reported and passed
  versions in either chamber. [verified]

  This node previously recorded the cross-biennium question as blocked. It was not; see
  [house-finance-committee](./house-finance-committee.yml) for the mistake, which was mine and
  was reading the wrong sheet of a workbook already committed here.
