class: actor
label: Senate Finance Committee
description: |
  The standing committee of the Ohio Senate that takes an appropriation bill after the House
  has passed it and produces the Senate's version.

  Seeded to make the middle of the legislative chain visible. The corpus previously held the
  [House committee](./house-finance-committee.yml) and the
  [governor](./governor.yml) but nothing between them, so every change between House passage
  and enactment was attributable only in aggregate. The Senate's revisions are frequently
  substantial and pull in different directions from the House's on the same items. [inference]

  **Answered for FY2026.** Senate-stage changes are smaller: 17.0% of the bill's total movement
  against the House substitute's 51.3%. [verified] But the Senate touched *more* line items —
  213 against 136 — so it made many smaller adjustments where the House made fewer larger ones.
  Magnitude and breadth point opposite ways, and either alone would mislead.

  The Senate floor, like the House floor, changed nothing: zero line items between the reported
  and passed versions. [verified] Both chambers finish their work in committee.

  **It holds in the previous biennium, and this role was larger there than here.** In HB 33 the
  Senate substitute carries 35.9% of FY2024's movement and 35.8% of FY2025's, against the House
  substitute's 43.3% and 51.1%. [verified] In HB 96 the same comparison was 17.0% against
  51.3%. So the Senate's share of the rewriting is not a stable property of the role — it
  roughly doubled between the two biennia while the House's stayed near half.

  Across HB 96 and HB 33 — both bills, all four fiscal years — zero line items and zero dollars
  moved between the reported and passed versions in either chamber. [verified]

  This node previously recorded the cross-biennium question as blocked. It was not; see
  [house-finance-committee](./house-finance-committee.yml) for that mistake.

  **A third biennium breaks the floor result, and it breaks on this chamber.** HB 166, FY2020-21, measured across all 1,371 line items: the
  House floor still moved nothing, but the **Senate floor did**. [verified]

  | | HB 166 FY2020 | HB 166 FY2021 |
  |---|---|---|
  | House reported → as passed by House | 0 items | 0 items |
  | Senate reported → **as passed by Senate** | **2 items, +$11.1M** | **1 item, +$0.1M** |

  Lupus Awareness (ALI 440481, Health) gained $100,000 on the Senate floor in each year, and
  Local Disaster Assistance (ALI 763511, Public Safety) gained $11,000,000 in FY2020.

  So the finding is narrower than two biennia suggested: chamber floors *rarely* move money and
  the House floor has moved none in three bills, but "the floors change nothing" is false. Two
  observations agreeing is a weaker thing than it feels like, and the corpus recorded it as a
  pattern one biennium before it had a counterexample.

  **[open] Whether the floor result tracks chamber leadership is unmeasured, and is the next
  thing to ask of it.** The one counterexample so far sits in the 133rd General Assembly; the
  two bills where both floors moved nothing are the 135th and 136th. Three points is not
  enough to see a pattern, but it is enough to know which covariate to record — and presiding
  officers change on a schedule that has nothing to do with fiscal years, so the question
  cannot be answered from the appropriation data alone.

  The `held_by` property on this node is where that belongs. It currently says only that
  membership and chairmanship turn over by General Assembly, which is exactly the kind of
  placeholder that stops a question being asked. What it needs is a dated succession: who
  presided, over which General Assembly, and which budget bill fell in their term.

  Note the counterexample is on the **Senate** floor, so the presiding officer that matters
  for it is the Senate President rather than the Speaker. Both are unmodelled — neither is an
  `actor` in this corpus yet — and seeding them is a prerequisite rather than an aside.

properties:
  name: Senate Finance Committee
  role_type: committee
  authority_basis: |
    Senate rules; the chamber's role in amending appropriation bills. [inference]
  held_by: |
    Membership and chairmanship turn over by General Assembly. [open] Not reconstructed.
  phase_active: legislative — second chamber
