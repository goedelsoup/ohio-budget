class: actor
label: Governor of Ohio
description: |
  The executive role that opens and closes the budget cycle. The governor submits the
  executive budget proposal to the General Assembly early in the first year of each biennium,
  and holds the line-item veto over appropriation bills under Article II, Section 16 of the
  Ohio Constitution. [inference]

  The line-item veto is why this role matters structurally rather than only politically. In
  most states and at the federal level, the executive's choice on a budget bill is binary.
  In Ohio the governor can strike individual items while allowing the rest to become law,
  which means the enacted budget is not any single body's product — it is the legislature's
  bill minus the executive's strikes. A corpus that modeled only "as passed" and "as enacted"
  without the veto between them would show an unexplained discontinuity.

  This is a role, not a person or an office. Its `held_by` property records occupancy, so
  that a change of governor does not sever the history of actions taken in the role.

  **A finding that qualifies all of the above.** Across all 1,528 line items in HB 96, the
  conference report amount and the enacted amount are identical for every one: zero line items,
  zero dollars. [verified] These line-item vetoes changed no appropriation figure in the bill.

  That does not make them inconsequential — an item veto can strike language without touching a
  figure, and Ohio operating budgets carry substantial policy language. [inference] What it
  means is that for the dollars, the enacted text is indistinguishable from the conference
  report, and any analysis of where money went can treat the conference committee as the last
  actor that moved it.

  [open] What the vetoes did strike is unreconstructed; the veto message is not catalogued.
properties:
  name: Governor of Ohio
  role_type: executive
  authority_basis: |
