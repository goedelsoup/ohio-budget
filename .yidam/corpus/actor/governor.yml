class: actor
label: Governor of Ohio
description: |
  The executive role that opens and closes the budget cycle. The governor submits the
  executive budget proposal to the General Assembly early in the first year of each biennium,
  and holds the line-item veto over appropriation bills under Article II, Section 16 of the
  Ohio Constitution. [inference]

  The line-item veto is why this role matters structurally rather than only politically. In
  most states and at the federal level, the executive's choice on a budget bill is binary.
  In Ohio the governor can strike individual items while allowing the rest to become law,
  which means the enacted budget is not any single body's product — it is the legislature's
  bill minus the executive's strikes. A corpus that modeled only "as passed" and "as enacted"
  without the veto between them would show an unexplained discontinuity.

  This is a role, not a person or an office. Its `held_by` property records occupancy, so
  that a change of governor does not sever the history of actions taken in the role.

  **What this role struck in HB 96 is now partly reconstructed.** LSC's comparison document
  annotates vetoed text inline; the education document alone carries 56 struck passages across 8
  provisions, including an entire Nonchartered Educational Savings Account Program that the
  House created and the governor removed. [verified] The inference that an item veto can strike
  language without touching a figure is no longer an inference — here it is what most of them
  did.

  **Across all 67 items, not one struck an appropriation amount.** [verified] The
  [veto message](../../catalog/governor-hb96-veto-messages.md) is committed, and every item
  deletes statutory or temporary-law language rather than a figure.

  That claim was asserted here from the spreadsheet, withdrawn as unsupported, and reinstated
  from the veto message — the same conclusion resting on evidence that can actually carry it.
  The column comparison never could: a pre-veto column would be identical to the conference
  report for reasons having nothing to do with vetoes.

  **The more useful finding is that this role moves money without moving any figure.** Item 6
  struck a set-aside directing 5% of State Share of Instruction to particular programmes; item
  19 struck three dredging earmarks and redirected the projects to another fund; item 22 struck
  a restriction on who may receive line item 440672. [verified] Every line item's total came
  through unchanged.

  So the item veto's reach is understated by any figure-level account of it. The power to strike
  language inside an appropriation is the power to redirect the appropriation, and in this bill
  that is almost entirely how it was used.

  **The power is not the last word, and this corpus assumed it was.** Item 66 was overridden by
  both chambers, restoring text this role had struck. [verified] The enacted budget is therefore
  the legislature's bill minus the executive's strikes *plus whatever the legislature puts back*,
  and the third term was missing from the model until
  [the override](../budget-action/hb96-veto-override-item-66.yml) was seeded. See
  [the General Assembly](./general-assembly.yml), the role that can act after enactment.

  [open] 64 of the 67 rationales are not yet transcribed into the corpus. They belong in one
  node per item.
  **A veto eliminated a line item outright in HB 166, and that changes the shape of this claim.**
  Between the conference report and the enacted text, ALI 651691 — Rural Healthcare Workforce
  Training and Retention Program, Medicaid, fund 5VW0 — went from $15,000,000 to **$0** in
  FY2020 and from $30,000,000 to **$0** in FY2021. [verified] A $45 million programme struck
  entirely.

  So the item veto does reach appropriation amounts. It did not in HB 33 or HB 96, where every
  one of the 44 and 67 items struck language — but those are facts about two bills, not about
  the power. The corpus was one biennium away from generalising them into a claim about the
  instrument.

  **This also settles how LSC's enacted column is read.** HB 166 heads it
  `As Enacted after Governor's Vetoes`, where HB 96 and HB 33 head the same column in the same
  series simply `As Enacted`, and its conference-to-enacted delta is non-zero. The columns
  straddle the veto. That was recorded here as an open question, and the earlier inference —
  identical columns meaning the vetoes moved no money — turns out to have been sound reasoning
  on a premise that had not yet been checked.

properties:
  name: Governor of Ohio
  role_type: executive
  authority_basis: |
    Ohio Constitution Article II Section 16 (line-item veto over appropriations); statutory
    duty to submit an executive budget. [inference]
  held_by: |
    Occupancy across the corpus window spans more than one administration. [open] Not yet
    reconstructed as a dated succession.
  phase_active: executive-preparation and post-passage
