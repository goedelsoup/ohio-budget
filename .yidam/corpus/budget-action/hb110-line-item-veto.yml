class: budget-action
label: Line-Item Vetoes, HB 110
description: |
  The governor's vetoes against [HB 110](../bill/hb110-134th.yml), the budget that enacted
  the Fair School Funding Plan. [inference]

  The third veto event in the corpus, and with three the pattern is established well enough to
  say something: an Ohio operating budget is not finished when the legislature passes it, and an
  analysis that treats the enacted text as the legislature's product is wrong by whatever the
  governor struck. Whether anything school-funding-related was struck here is unknown and
  material to the phase-in question. [open]
