class: budget-action
label: Line-Item Vetoes, HB 33
description: |
  The governor's line-item vetoes against [HB 33](../bill/hb33-135th.yml) before it became law
  in July 2023. [inference]

  Seeded as the second veto event, which is what makes the first one interpretable. A single
  veto node invites reading the executive edit as an unusual intervention; two, on consecutive
  budgets, establish it as a routine stage of every Ohio operating budget — and therefore as
  something an analysis must account for by default rather than notice when it happens.

  [open] Count, items struck, and aggregate effect are unreconstructed. The veto message is the
  primary source and is not catalogued.
properties:
  action_type: line-item-veto
  action_date: 2023-07-04
  direction: decrease
  amount_delta: "[open] aggregate effect not reconstructed"
  stated_justification: |
    Each of the 44 items states its own reason, closing with the standard formula. The
    [veto message](../../catalog/governor-hb33-veto-messages.md) is committed. [verified]

    Item 13, striking a provision that would have had the Tax Commissioner set personal income
    tax rates and brackets: "The Ohio Constitution specifically grants the power to set tax
    rates to the legislative branch... As such, this provision is unconstitutional." [verified]

    [open] The remaining 43 are not transcribed here. They belong in one node per item.
  phase: executive
