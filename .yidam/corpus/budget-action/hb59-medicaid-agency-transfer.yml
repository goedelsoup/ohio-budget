class: budget-action
label: Medicaid Transfer to a Separate Department, HB 59
description: |
  The provision in [HB 59](../bill/hb59-130th.yml) moving Medicaid administration and its
  appropriations from Job and Family Services to a new Department of Medicaid. [inference]

  Classified as a technical correction in the corpus's vocabulary because it moved no money in
  net — the same benefits were funded before and after. That classification is doing real work:
  it marks the FY2014 discontinuity in every Medicaid series as organizational rather than
  fiscal, which is precisely the distinction a code-keyed query cannot make.

  **The assertion is now confirmed from a committed source.** HB 59's workbook carries both
  codes: ALI 600525 under `JFS` at $0.00 in FY2014 and FY2015, and ALI 651525 under `MCD` at
  $13,701,114,114 and $14,599,795,041. [verified] The predecessor was retained at zero rather
  than removed, so the succession is legible in one document instead of inferred from the
  absence of a row in the next.

  The item number is preserved across the move — 600**525** to 651**525** — and the agency
  prefix is what changes.
