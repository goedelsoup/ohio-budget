class: budget-action
label: Line-Item Vetoes, HB 96
description: |
  The governor's line-item vetoes exercised against HB 96 before it became law at the end of
  June 2025. [inference]

  This is the corpus's executive-phase exemplar, and the node that resolves what would otherwise
  be an unexplained discontinuity. The enacted text is the legislature's bill *minus* these
  strikes, which means [HB 96 as enacted](../bill-version/hb96-as-enacted.yml) is not any single
  body's product. Without this node, a comparison between the House-passed and enacted versions
  would silently attribute the governor's decisions to the legislature.

  The veto power's asymmetry matters for interpretation and is worth stating explicitly: under
  Article II, Section 16 the governor may strike items but not add or increase them.
  [inference] Any apparent increase between as-passed and as-enacted is therefore never
  attributable to a veto, and must have another explanation.

  **What the vetoes struck is now partly reconstructed.** LSC's comparison document annotates
  struck text inline, and the education document alone carries **56 struck passages across 8
  provisions**. [verified] They are language, not figures: eligibility rules, administrative
  duties, award formulas, tax levy mechanics. The largest is
  [EDUCD118](../../catalog/lsc-hb96-comparison.md), an entire Nonchartered Educational Savings
  Account Program — created by the House, absent from the Senate's version, restored at
  enactment, and then struck whole. [verified]

  Four strikes are mid-sentence rather than whole-passage. The governor removed `of up to
  $10,000` from a research grant provision and left the rest of it standing. [verified] An item
  veto is finer-grained than "item" suggests.

  **No appropriation amount was struck.** The
  [veto message](../../catalog/governor-hb96-veto-messages.md) is now committed, and across all
  **67 items** not one deletes an appropriation figure. Every item strikes statutory or
  temporary-law language, and no rationale in the document describes reducing or eliminating an
  appropriation. [verified]

  This claim was made here before, withdrawn, and is now reinstated on different grounds. The
  original basis was that the spreadsheet's conference-report and as-enacted columns are
  identical across 1,528 line items — true, but unable to support the conclusion, since a
  pre-veto column would look identical for reasons having nothing to do with vetoes. The veto
  message settles it directly by saying what was struck. The corpus reached the right answer
  from bad evidence, which is worth recording as its own kind of error.

  **But the vetoes did move money, and that is the finding.** At least three struck the
  *distribution* inside a line item while leaving its total alone: [verified]

  - item 6 removed a set-aside directing 5% of State Share of Instruction to 90-credit-hour
    degree programmes and College Credit Plus pathways;
  - item 19 removed three dredging earmarks from the GRF Parks and Recreation line, the
    administration directing ODNR to fund the projects from the Waterways Safety Fund instead;
  - item 22 removed a bar on distributing line item 440672 to youth shelters that "promote or
    affirm social gender transition".

  So "no appropriation figure changed" and "no money moved" are different claims, and only the
  first is true. An item-level comparison of the bill before and after the veto shows nothing at
  all while 5% of a multi-hundred-million-dollar line changes destination. This is the third
  independent instance of
  [appropriation-is-not-distribution](../../decisions/appropriation-is-not-distribution.yml),
  and the first arriving from the executive rather than the legislature.

  A probe recorded here earlier is also resolved. Line item 800639, Fire Department Grants,
  gains $8,000,000 at the senate-reported stage and carries it into as-enacted; reporting had
  described an $8 million fire-department increase among items sent to the governor for veto.
  **No item in the veto message concerns fire department grants.** [verified] It was sent, not
  struck — the secondary source described what was asked for, not what was done.

  This node is modeled as a single action covering the veto event. The
  [`governor`](../../../crates/governor/) connector now reads the message into one record per
  item — 67 items, 773 deletion instructions, none unrecognised — so splitting this into 67
  nodes is a mechanical step whenever the corpus wants that granularity. It should be a split
  rather than an edit, so this node's history stays attached to the event it describes.
properties:
  action_type: line-item-veto
  action_date: 2025-06-30
  direction: decrease
  amount_delta: "$0.00"
  stated_justification: |
    Each of the 67 items carries its own reason, closing with "Therefore, a veto of this item is
    in the public interest." Three, matching provisions the comparison connector extracts:
    [verified]

    Item 27, the Nonchartered Educational Savings Account Program: nonchartered nonpublic
    schools decline state chartering "due to truly held religious beliefs" and are subject to
    far fewer requirements, so "infusing significant state funding to support NCNP schools is
    contrary to the long-standing public policy that differentiates between chartered nonpublic
    schools and nonchartered nonpublic schools."

    Item 5, the Ohio Higher Education Research Public Policy Consortium: capping awards at
    $10,000 "would be detrimental to attracting research proposals and may prevent strong
    proposal submissions."

    Item 6, the State Share of Instruction set-aside: while supporting the expansion of College
    Credit Plus and 90-credit-hour degrees, requiring 5% of SSI to be allocated on that basis
    was not accepted.

    [open] The remaining 64 are not transcribed here. They belong in one node per item rather
    than in this field.
  phase: executive
