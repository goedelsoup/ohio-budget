class: budget-action
label: Senate Substitute Amendment to Foundation Funding, HB 96
description: |
  The Senate's change to the House-passed
  [foundation funding](../line-item/foundation-funding.yml) figure, incorporated into
  [HB 96's Senate substitute](../bill-version/hb96-senate-substitute.yml). -$72,888,202.
  [verified]

  The largest single move in the FY2026 series, and larger in magnitude than the conference
  adjustment and the governor's action combined. It is also the step that makes the corpus's
  priority-2 question worth asking: the House raised school funding by $92 million, the Senate
  took back $73 million of it, conference restored $10 million, and the executive left it
  alone. The enacted figure is the residue of a disagreement, not anyone's proposal.

  Re-pointed from as-passed-senate for the same reason as its House counterpart — the Senate's
  floor delta is zero and the money moved at the substitute stage.

  [open] The stated justification is unreconstructed. Whether the reduction reflected a
  different view of the phase-in schedule or of the revenue available to fund it is exactly the
  question this node exists to hold open.
properties:
