class: budget-action
label: Senate Substitute Amendment to Foundation Funding, HB 33
description: |
  The Senate's reduction of the House-passed
  [foundation funding](../line-item/foundation-funding.yml) figure for FY2024, incorporated
  into [HB 33's Senate substitute](../bill-version/hb33-senate-substitute.yml).
  -$173,800,000. [verified]

  It takes back 28% of what the House added. In HB 96 the same step took back 79%. Both
  chambers behave the same way in both biennia — the House raises, the Senate cuts, conference
  settles above both — but how far the Senate goes is not a constant.

  The comparison document states the Senate's effect and not its mechanism: it concurs with the
  House on every numbered change to the formula while reducing the allocation by $245.6 million.
  [verified] The reduction is therefore somewhere other than the base cost changes the House
  made, and this provision does not say where.
properties:
  action_type: amendment
  action_date: "[open] 2023, pending verification"
  direction: decrease
  amount_delta: "-$173,800,000.00"
  stated_justification: |
    From the LSC comparison document, provision EDUCD38, As Passed By Senate column, stated
    fiscal effect: "Same as the House, but decreases the estimated FY 2024 allocations by $245.6
    million in FY 2024, to $7.81 billion, and the estimated FY 2025 allocation by $295.8
    million, to $7.97 billion." [verified]

    [open] The document records the Senate's *effect* here but concurs with the House on every
    numbered change to the formula, so which input the Senate altered to produce the reduction
    is not recoverable from this provision alone.
  phase: legislative
