class: bill-version
label: HB 96 As Passed by the House
description: |
  HB 96 as passed to the Senate, after House committee and floor action. [verified]

  The genesis note here claimed the House substitute is typically the largest single rewrite
  of the executive proposal. For this bill that holds: the substitute added $92,250,000 to
  foundation funding, against $1,500,000 more at committee report and nothing at all on the
  floor. [verified] Whether it generalizes across the window is still open. [open]

  This version now sits in a complete chain. It supersedes
  [house-reported](./hb96-house-reported.yml) rather than jumping from as-introduced, and its
  successor is [senate-substitute](./hb96-senate-substitute.yml) rather than
  as-passed-senate — the four intermediate stages were added once the LSC spreadsheet showed
  the process has nine, not six. `stage-delta` over foundation funding FY2026 therefore
  attributes every step rather than reporting an aggregate.
properties:
  stage: as-passed-house
  stage_date: "[open] spring 2025, exact date pending verification"
  chamber: house
  document_reference: |
    LSC appropriation spreadsheet, HB 96 as enacted, column "House Passed FY 2026".
    [verified]
  is_operative: "no"
