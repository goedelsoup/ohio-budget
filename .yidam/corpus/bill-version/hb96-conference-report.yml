class: bill-version
label: HB 96 Conference Report
description: |
  The reconciled text of [HB 96](../bill/hb96-136th.yml) produced by the conference committee
  and voted on by both chambers. [inference]

  This is the version the legislature actually enacted, before the governor's
  [line-item vetoes](../budget-action/hb96-line-item-veto.yml) removed items from it. Holding it
  separately from [as enacted](./hb96-as-enacted.yml) is what lets the corpus separate the
  legislature's final position from the executive's edit — the difference between the two is,
  by definition, exactly the vetoes and nothing else.

  Without this node, "what the legislature passed" is not recoverable from the corpus at all.

  Figures for this stage are extracted — the spreadsheet carries a `Conference Report` column
  for all 1,528 line items, and this stage moved 15.3% of the bill's total. [verified] What
  remains absent is the *reason*: conference-stage changes carry no stated justification
  comparable to a committee record, and that absence is a property of the process rather than a
  gap in extraction. See [conference committee](../actor/conference-committee.yml).
properties:
  stage: conference-report
  stage_date: 2025-06-25
  chamber: conference
  document_reference: |
    LSC appropriation spreadsheet, column "Conference Report", committed. [verified]
    [open] The conference committee report itself is not catalogued (ga-hb96-conference-report-text). See [bill-text-on-demand](../../decisions/bill-text-on-demand.yml).
  is_operative: "no"
