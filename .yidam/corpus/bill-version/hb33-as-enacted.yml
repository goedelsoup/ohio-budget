class: bill-version
label: HB 33 As Enacted
description: |
  [HB 33](../bill/hb33-135th.yml) as it became law in July 2023, after line-item vetoes.
  [inference]

  Seeded to give the FY2024-25 appropriations something to be stated in. Without it, the
  [foundation funding figure for that biennium](../appropriation/foundation-funding-fy2024-as-enacted.yml)
  was an amount attributed to a bill with no version attached — which is exactly the
  ambiguity the bill-version class exists to remove, since "HB 33 appropriated X" is
  underdetermined between the proposal, each chamber's version, and the enacted text.

  It was a single-stage seed, and recorded that no stage-delta was computable for this
  biennium because the introduced, House, and Senate versions were absent. All eight are now
  seeded, from the `EN` sheet of a workbook that had been committed here the whole time — see
  [the catalog entry](../../catalog/lsc-hb33-appropriation-spreadsheet.md) for how that sheet
  went unread.

  **The vetoes on this bill were also overridden.** The General Assembly's action table records
  the House passing an item notwithstanding the governor's objections on 13 December 2023 and
  the Senate on 24 January 2024. [verified] So HB 96 is not a special case: in both biennia the
  corpus has examined, the enacted text kept moving after enactment. See
  [the HB 96 override](../budget-action/hb96-veto-override-item-66.yml) for the shape of the
  event, and [general-assembly](../actor/general-assembly.yml) for the role.

  [open] Which HB 33 items were overridden is not reconstructed. Its veto message *is*
  catalogued and read — [governor-hb33-veto-messages](../../catalog/governor-hb33-veto-messages.md),
  44 items — but a veto message records what the governor struck, not what the chambers later
  restored, so the override set has to come from the journals.
properties:
