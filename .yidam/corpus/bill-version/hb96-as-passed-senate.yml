class: bill-version
label: HB 96 As Passed by the Senate
description: |
  [HB 96](../bill/hb96-136th.yml) after Senate committee and floor action. [inference]

  Seeded to close part of the attribution gap the genesis corpus left. With only the introduced,
  House, and enacted versions present, every change after House passage was one undifferentiated
  hop covering Senate action, conference reconciliation, and the governor's vetoes — three
  actors, one number. This version and the
  [conference report](./hb96-conference-report.yml) split that hop into steps that can be
  attributed separately.

  Figures for this stage are extracted: the appropriation spreadsheet carries a
  `Senate Passed FY 2026` column for all 1,528 line items, and `stage-delta` measured the
  Senate floor's movement across it at zero. [verified] This node said no figures were
  extracted long after they were, which is the same staleness the validator now catches when
  it appears next to a filled money property — and does not catch here, because a bill version
  holds no amount of its own.
properties:
  stage: as-passed-senate
  stage_date: 2025-06-11
  chamber: senate
  document_reference: |
    LSC appropriation spreadsheet, column "Senate Passed", and the
    [comparison document](../../catalog/lsc-hb96-comparison.md), both committed. [verified]
    [open] The Senate-passed bill text itself is not catalogued (ga-hb96-as-passed-senate-text). See [bill-text-on-demand](../../decisions/bill-text-on-demand.yml).
  is_operative: "no"
