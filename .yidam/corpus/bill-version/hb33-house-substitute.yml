class: bill-version
label: HB 33 House Substitute
description: |
  [HB 33](../bill/hb33-135th.yml) at the house substitute stage. [verified]

  The largest single rewrite in the bill, carrying 43.3% of FY2024's total movement and 51.1% of FY2025's. [verified]

  Seeded when the workbook's `EN` sheet turned out to carry all nine stages — the sheet an
  earlier reading of this source missed, which is why
  [HB 33 as enacted](./hb33-as-enacted.yml) said no stage-delta was computable for this
  biennium. It is.
