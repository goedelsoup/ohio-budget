    "Reported - Substitute" action on 2023-04-26 and not the earlier moment the substitute was
    introduced in committee. LSC publishes the two as separate columns with different
    figures, so they are distinct documents. [verified]
  chamber: house
  document_reference: |
    LSC appropriation spreadsheet, HB 33 as enacted, sheet EN, column "House Substitute". [verified]
  is_operative: "no"
