class: bill-version
label: HB 33 Senate Substitute
description: |
  [HB 33](../bill/hb33-135th.yml) at the senate substitute stage. [verified]

  The Senate's rewrite, at 35.9% of FY2024's movement — more than twice its counterpart's share in HB 96. [verified]

  Seeded when the workbook's `EN` sheet turned out to carry all nine stages — the sheet an
  earlier reading of this source missed, which is why
  [HB 33 as enacted](./hb33-as-enacted.yml) said no stage-delta was computable for this
  biennium. It is.
