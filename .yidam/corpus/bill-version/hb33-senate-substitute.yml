    "Reported - Substitute" action on 2023-06-14 and not the earlier moment the substitute was
    introduced in committee. LSC publishes the two as separate columns with different
    figures, so they are distinct documents. [verified]
  chamber: senate
  document_reference: |
    LSC appropriation spreadsheet, HB 33 as enacted, sheet EN, column "Senate Substitute". [verified]
  is_operative: "no"
