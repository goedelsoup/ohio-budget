class: bill-version
label: HB 110 Senate Substitute
description: |
  [HB 110](../bill/hb110-134th.yml) at the senate substitute stage. [verified]

  The stage at which the Fair School Funding Plan enters this bill. Foundation funding rises $267,879,867 here, after the House had cut it — see [the enactment](../budget-action/hb110-fair-school-funding-enactment.yml).

  Seeded so `stage-delta` can decompose a third and fourth biennium. The first two agreed on a
  pattern that these two do not share — see
  [house-finance-committee](../actor/house-finance-committee.yml).
