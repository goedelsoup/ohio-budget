description: |
  Medicaid-funded behavioral health services appropriated to
  [Mental Health and Addiction Services](../agency/mental-health-and-addiction-services.yml)
  rather than to the Department of Medicaid. [inference]

  The second Medicaid line item outside the Medicaid department, after
  [developmental disabilities](./developmental-disabilities-services.yml). Together they make
  the point structural: a Medicaid total assembled from one agency understates the program, and
  the size of the understatement is not knowable without enumerating the other agencies.
