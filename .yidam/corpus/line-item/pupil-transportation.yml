class: line-item
label: Pupil Transportation
description: |
  State support for school district transportation costs, distributed by a formula
  separate from the main school funding formula. [inference]

  Seeded because it demonstrates that a program is not a line item. The
  [Fair School Funding Plan](../program/fair-school-funding-plan.yml) is commonly described as
  *the* school funding formula, but districts receive state education money through several
  line items with different formulas, and transportation is the largest of the others.
  [inference] A claim about what a district receives from the state is incomplete if it cites
  only foundation funding.

  [open] The code and the transportation formula's basis are unreconstructed.
  ALI 200502, agency EDU. [verified]
