class: line-item
label: Highway Construction
description: |
  The line item funding construction and reconstruction of the state highway system, held by
  the [Department of Transportation](../agency/department-of-transportation.yml) and drawn from
  the [highway operating fund](../fund/highway-operating-fund.yml). [inference]

  It is seeded as the corpus's restricted-fund case. Because its money originates in
  constitutionally restricted [motor fuel tax](../revenue-source/motor-fuel-tax.yml) receipts,
  this line item does not compete with any general revenue line item. That makes it the
  counterexample to the intuition the rest of the corpus might otherwise encourage — that every
  appropriation is a choice against every other.

  It also sits in a different bill on a different schedule, appropriated through
  [HB 54](../bill/hb54-136th.yml) rather than the main operating budget. A query for "the
  largest line items in the Ohio budget" that reads only the operating budget will not see it.

  [open] The code is unverified and not guessed. The split between preservation and new
  capacity within this line item, which matters for any claim about whether Ohio is
  maintaining or expanding its system, is also unreconstructed.

  ## Not in this source family

  **The main operating budget does not appropriate it.** Highway construction is funded through
  Ohio's separate biennial *transportation* budget — HB 54 in the 136th General Assembly, whose
  [as-enacted version](../bill-version/hb54-as-enacted.yml) the corpus already seeds — and no
  ALI matching this node appears in any of the fourteen main-operating workbooks committed here.
  [verified]

  That is a fact about Ohio's budget structure rather than a gap in extraction, and it is worth
  the node saying so: a reader who finds every other line item carrying fifteen years of figures
  is entitled to know why this one carries none.

  [open] The transportation budget is a distinct source family with its own workbooks, and no
  connector reads it (lsc-transportation-budget).

