class: line-item
label: Foundation Funding
description: |
  The general revenue line item through which the state's share of school district operating
  costs is distributed. The largest single education appropriation and among the largest line
  items in the budget. [inference]

  **It is not the whole of foundation funding, and this node read as though it were.** Three
  line items carry the identical name *Foundation Funding - All Students*, differing only in the
  fund they draw on: [verified]

  | ALI | fund | FY2024 enacted | FY2026 enacted |
  |---|---|---|---|
  | 200550 (this node) | GRF | $7,967,250,000 | $8,457,598,772 |
  | [200612](./foundation-funding-lottery.yml) | 7017, lottery | $1,274,945,000 | $1,436,583,202 |
  | [200604](./foundation-funding-dpf.yml) | 5VS0 | $600,000,000 | $600,000,000 |
  | **programme total** | | **$9,842,195,000** | **$10,494,181,974** |

  This line item is **80.6%** of the programme in FY2026. Every figure below it in the corpus —
  the nine-stage series, the computed gap — is a general revenue figure and correct as such, but
  a reader taking "foundation funding" to mean school funding understates it by $2.04 billion.

  The confusion is not the reader's fault. Matching on the name returns three line items,
  matching on the code returns one, and neither source announces which you have. It surfaced
  only when the [HB 33 comparison document](../../catalog/lsc-hb33-comparison.md) reported a
  distribution to traditional districts *larger* than this line item's authority — an
  impossibility that had to mean the programme drew on something else.

  It is the corpus's most fully developed line item, chosen because it demonstrates every
  property the class was designed for. It distributes by formula rather than by discretion, so
  its amount is a consequence of the
  [Fair School Funding Plan](../program/fair-school-funding-plan.yml) rather than an
  independent decision. It passes state money to entities the state does not control, landing
  as [specific disbursements](../expenditure/foundation-funding-fy2024-disbursed.yml) to
  roughly six hundred districts. [inference] And its ownership changed mid-window when the
  Department of Education was restructured into the
  [Department of Education and Workforce](../agency/department-of-education-and-workforce.yml).

  Its code is 200550 and its name in the source is "Foundation Funding - All Students", held
  by agency `EDU`, drawn from the general revenue fund. [verified] This was carried as an
  `[inference]` from genesis until the appropriation spreadsheet was read, and it held.

  [open] Whether the code survived the education restructuring unchanged is still open, and is
  exactly the kind of question the `lineage` calculator exists to raise.

  ## Four biennia of legislative movement, and no stable pattern

  The corpus now holds a complete nine-stage series for this line item in each of four bills.
  Comparing the substitute stages, where nearly all movement happens: [verified]

  | | House substitute | Senate substitute | conference | net |
  |---|---|---|---|---|
  | FY2020 (HB 166) | **-$250.0M** | -$2.5M | -$1.5M | **-$253.4M** |
  | FY2022 (HB 110) | **-$154.5M** | **+$267.9M** | -$24.0M | +$102.4M |
  | FY2024 (HB 33) | +$627.0M | -$173.8M | +$261.0M | +$716.7M |
  | FY2026 (HB 96) | +$92.3M | -$72.9M | +$10.5M | +$32.6M |

  **The shape recorded from the two most recent bills — House raises, Senate takes part of it
  back, conference settles above both — holds only in those two.** In FY2020 the House cut this
  line item and every later stage cut it further. In FY2022 the House cut it and the *Senate*
  restored it, which is the reverse of the later pattern and is where the Fair School Funding
  Plan enters the bill.

  So neither chamber has a stable disposition toward school funding across the window. What
  looked like a role behaving characteristically was two adjacent biennia.

  The deltas above are each stated in the dollars of their own biennium, so their *magnitudes*
  are not comparable across rows even though their signs are. In FY2025 dollars the House
  substitute figures are -$307.5M, -$167.8M, +$638.8M and +$88.7M — the FY2020 cut is a fifth
  larger than it looks and the FY2026 rise is smaller. [verified] Restating cannot change any
  sign, because deflation multiplies a period's figures by one positive number; it changes only
  how the four rows rank against each other.

  ## Fifteen years in constant dollars

  Enacted appropriations FY2012 through FY2026, restated in FY2025 dollars: [verified]

  | fiscal year | as enacted | in FY2025 dollars | | fiscal year | as enacted | in FY2025 dollars |
  |---|---|---|---|---|---|---|
  | FY2012 | $5,536,347,861 | $7,958,168,203 | | FY2020 | $6,942,880,845 | $8,539,062,383 |
  | FY2013 | $5,610,290,686 | $7,843,234,563 | | FY2021 | $6,774,618,845 | $7,987,305,649 |
  | FY2014 | $5,808,098,389 | $7,884,218,676 | | FY2022 | $6,937,998,712 | $7,536,733,622 |
  | FY2015 | $6,151,463,768 | $8,272,919,534 | | FY2023 | $7,079,848,712 | $7,340,748,033 |
  | FY2016 | $6,398,844,920 | $8,644,907,566 | | FY2024 | $7,967,250,000 | $8,116,577,890 |
  | FY2017 | $6,655,755,799 | $8,880,502,302 | | FY2025 | $8,269,497,000 | $8,269,497,000 |
  | FY2018 | $6,799,882,816 | $8,764,521,089 | | FY2026 | $8,457,598,772 | $8,127,920,017 |
  | FY2019 | $6,937,228,845 | $8,688,306,809 | | | | |

  **Nominal +52.8% across fourteen years; real +2.1%.** [verified] The state's largest education
  line item bought about as much in FY2026 as in FY2012, having risen by $2.92 billion.

  The window matters, and it is worth being explicit that a shorter one says something different
  and equally true: **FY2020 to FY2026 is +21.8% nominal and -4.8% real.** Neither figure is the
  honest one on its own. Which is quoted decides whether this line item looks flat or falling.

  The real series has a shape the nominal one has nowhere:

  - It **peaks at FY2017** ($8.88B) — the high-water mark of the whole window, four years before
    the Fair School Funding Plan.
  - It **falls for six consecutive years** to a FY2023 trough of $7.34B, 17.3% below that peak.
  - It **recovers sharply at FY2024** (+10.6%, the largest annual real move in the series) and
    turns down again at FY2026.

  [open] The FY2024 step coincides with the plan's phase-in, and the corpus should not assert
  the connection from this series alone — the plan is one of several things that changed. What
  the series does establish is that the recovery starts from a trough rather than from the
  FY2017 level, so the plan's first two budgets restored ground rather than breaking new.

  The programme total behaves the same way: the three foundation-funding line items together
  come to $9.84B in FY2024 and $10.49B in FY2026, **+6.6% nominal and +0.6% real**. [verified]
  The 80.6% share above is a within-year ratio and deflation cannot move it.

