class: line-item
label: Foundation Funding
description: |
  The general revenue line item through which the state's share of school district operating
  costs is distributed. It is the largest single education appropriation and among the largest
  line items in the budget. [inference]

  It is the corpus's most fully developed line item, chosen because it demonstrates every
  property the class was designed for. It distributes by formula rather than by discretion, so
  its amount is a consequence of the
  [Fair School Funding Plan](../program/fair-school-funding-plan.yml) rather than an
  independent decision. It passes state money to entities the state does not control, landing
  as [specific disbursements](../expenditure/foundation-funding-fy2024-disbursed.yml) to
  roughly six hundred districts. [inference] And its ownership changed mid-window when the
  Department of Education was restructured into the
  [Department of Education and Workforce](../agency/department-of-education-and-workforce.yml).

  Its code is 200550 and its name in the source is "Foundation Funding - All Students", held
  by agency `EDU`, drawn from the general revenue fund. [verified] This was carried as an
  `[inference]` from genesis until the appropriation spreadsheet was read, and it held.

  [open] Whether the code survived the education restructuring unchanged is still open, and is
  exactly the kind of question the `lineage` calculator exists to raise.
properties:
