class: line-item
label: Public Library Fund Distribution
description: |
  The statutory distribution of a share of state tax receipts to public library systems.
  [inference]

  The sibling of [local government fund distribution](./local-government-fund-distribution.yml),
  and seeded for the same reason its fund was: two formula distributions reduced in the same
  period read as a shift of fiscal weight onto local entities, where one reads as a targeted
  cut. Which of those is true is an empirical question, and it needs both nodes to be asked.

  [open] The percentage by biennium is unreconstructed.
