class: line-item
label: Local Government Fund Distribution
description: |
  The line item through which money in the
  [local government fund](../fund/local-government-fund.yml) is distributed to counties,
  municipalities, and townships. [inference]

  It is seeded because it is the clearest case in the corpus of an appropriation that is not
  really a decision. The amount follows from a statutory percentage of general revenue tax
  receipts, so the line item's size is a consequence of tax collections and of the percentage
  set in law — not of a discretionary judgment made during budget deliberation. Changing what
  local governments receive means changing the percentage, which is a policy act that appears
  in bill language rather than in an appropriation figure.

  That is why the sharp reduction to the percentage in the FY2012-13 operating budget
  [inference] is the single most consequential event in this corpus's window for local
  finance, and why it is nearly invisible to an analysis that reads appropriation figures
  alone. It shows up as a smaller number with no apparent decision attached.

  [open] The code, and the percentage by biennium across the window, are unverified.
  ALI 110969. The source assigns it to agency `RDF`, revenue distribution funds, not to
  the Department of Taxation as this node asserted. [verified] RDF is an accounting
  construct rather than a department, so the belongs-to edge is left in place and
  flagged: [open] which department administers the distribution, as distinct from which
  agency code carries the appropriation, is now an open question rather than an
  assumption.
