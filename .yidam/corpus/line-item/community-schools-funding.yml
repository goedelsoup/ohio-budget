label: Community Schools Funding
description: |
  State funding for community schools. [inference]

  Seeded because its money is not additional: amounts follow the student and are deducted from
  the resident district's foundation funding. [inference] A district's published foundation
  figure and what it retains are therefore different numbers, and the corpus cannot currently
  distinguish them — which is a real limitation on any per-district claim it makes.
