class: line-item
label: Tangible Personal Property Tax Reimbursement
description: |
  State reimbursement to local governments and school districts for revenue lost when the
  tangible personal property tax on business equipment was eliminated in favour of the
  [commercial activity tax](../revenue-source/commercial-activity-tax.yml). [inference]

  This is the other half of the swap, and the half that expired. The reimbursements were phased
  down during the corpus window, so a local entity experienced the elimination of a tax it used
  to receive, a period of being made whole, and then the withdrawal of that too. [inference]

  Reading the [local government fund](./local-government-fund-distribution.yml) reduction
  without this line item in view understates what happened to local finance in the same period,
  because two separate withdrawals overlapped.
