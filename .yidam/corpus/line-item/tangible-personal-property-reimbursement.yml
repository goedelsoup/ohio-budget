class: line-item
label: Tangible Personal Property Tax Reimbursement
description: |
  State reimbursement to local governments and school districts for revenue lost when the
  tangible personal property tax on business equipment was eliminated in favour of the
  [commercial activity tax](../revenue-source/commercial-activity-tax.yml). [inference]

  This is the other half of the swap, and the half that expired. The reimbursements were phased
  down during the corpus window, so a local entity experienced the elimination of a tax it used
  to receive, a period of being made whole, and then the withdrawal of that too. [inference]

  Reading the [local government fund](./local-government-fund-distribution.yml) reduction
  without this line item in view understates what happened to local finance in the same period,
  because two separate withdrawals overlapped.

  ## Eight codes, two merges and a renumbering — all of it one wind-down

  Traced through the committed workbooks, the reimbursement for the abolished tangible personal
  property tax is appropriated under eight ALIs across the window, in three phases: [verified]

  | period | local government | schools |
  |---|---|---|
  | FY2012-FY2015 | **110981** business, **110954** utility | **200909** business, **200900** utility |
  | FY2016-FY2025 | **110907** | **200902** |
  | FY2026-FY2027 | **110403** | **200417** |

  Two ALIs merge into one on each side at FY2016, and both are renumbered again at FY2026. The
  figures fall throughout: the education side runs $0.36B in FY2016 to $0.05B in FY2025, and the
  local side $0.07B to $0.01B, which is what a reimbursement being wound down looks like.

  **The corpus does not model this yet, and the reason is specific.** Its
  [durable-identity design](../line-item.ont.yml) handles a line item renumbered — that is
  `succeeds`, and [the rollback reimbursement](./property-tax-rollback-reimbursement.yml) uses it
  for exactly this. It has no pattern for **two line items merging into one**. A `succeeds` edge
  from 110907 to both 110981 and 110954 would assert two identities became one, which is true of
  the money and false of the identity, and nothing downstream would know which reading to take.

  [open] Whether the class needs a `consolidates` edge distinct from `succeeds`, or whether a
  merge should be modelled as one line item ending and another beginning with the relationship
  recorded only in prose. This is the first merge the corpus has met; a second would say more
  about which answer is right than arguing about this one will.

