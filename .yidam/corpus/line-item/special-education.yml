class: line-item
label: Special Education Enhancements
description: |
  State support for the additional cost of educating students with disabilities, distributed
  by category of disability on top of the base formula amount. [inference]

  Seeded because it is where the school funding formula's weighting logic lives. Base cost per
  pupil is the headline; the categorical weights determine what a district with an unusual
  population profile actually receives, and two districts with identical enrollment can receive
  materially different amounts because of them.
