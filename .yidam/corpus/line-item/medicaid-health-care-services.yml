class: line-item
label: Medicaid Health Care Services
description: |
  The principal line item funding Medicaid benefits, held by the
  [Department of Medicaid](../agency/department-of-medicaid.yml). [inference] It is the
  largest line item in the state budget on an all-funds basis. [inference]

  It demonstrates the property that makes appropriation and expenditure worth separating.
  Because [Medicaid](../program/medicaid.yml) cost is driven by enrollment and federal match
  rather than by legislative choice, this line item's appropriation functions closer to an
  estimate than to a limit, [inference] and it is among the most frequent subjects of
  controlling board adjustment and supplemental action. The gap between what is appropriated
  here and what is spent is therefore not evidence of underspending — it is evidence about how
  well caseload was forecast.

  It is also the line item whose lineage is most disrupted. When the Department of Medicaid was
  separated from Job and Family Services partway through the corpus window, [inference] the
  Medicaid appropriations moved to a new agency code, breaking any code-keyed series at that
  point. The predecessor line item is not yet seeded, so the `succeeds` edge has no target.

  ALI 651525, agency MCD, general revenue fund. [verified] Its predecessor is
  [ALI 600525 under Job and Family Services](./medicaid-services-odjfs.yml), confirmed from
  HB 59's workbook, which carries both codes at once.

  ## This line item is a third of the programme

  Medicaid benefits are appropriated across five line items in four fund groups. Enacted, in
  billions: [verified]

  | ALI | fund | what it carries | FY2014 | FY2026 |
  |---|---|---|---|---|
  | 651525 (this node) | GRF | state-share benefits | 13.70 | 20.19 |
  | [651623](./medicaid-health-care-services-federal.yml) | FED | federally reimbursed benefits | 2.97 | 12.57 |
  | 651639 | DPF | recoveries | 0.46 | 0.94 |
  | 651656 | DPF | hospital upper-payment / franchise fee | 0.53 | 2.63 |
  | 651684 | DPF | health insuring corporation fee | — | 0.88 |
  | **programme** | | | **17.66** | **37.22** |

  **The programme grew +110.7% nominal and +49.2% real; this line item grew +47.4% and +4.3%.**
  [verified] Reading the general revenue series as Medicaid spending understates the programme's
  real growth by an order of magnitude, and it is the difference between "Medicaid barely moved"
  and "Medicaid is the one thing in this corpus that genuinely grew."

  ### The FY2018 fall was reclassification, not restraint

  This node previously recorded a $4.36 billion drop between FY2017 and FY2018 and declined to
  explain it. Across the whole programme that step is: [verified]

      651525  GRF   -4.36B
      651623  FED   +2.90B
      651684  DPF   +0.59B   (line item created)
      651639  DPF   +0.21B
      651656  DPF   +0.01B
      -------------------
      net           -0.65B

  Eighty-five percent of the apparent collapse is money moving between funds. The net movement
  is a fifteenth of what the general revenue line alone reports.

  This is the fifth arrival of
  [appropriation is not distribution](../../decisions/appropriation-is-not-distribution.yml),
  and the same variety as the third: a line item that is a slice of a programme *by fund*,
  exactly as foundation funding is three ALIs.

  ### All five are now modelled, and the corpus reproduces the total independently

  [Recoveries](./medicaid-services-recoveries.yml),
  [the hospital franchise fee](./medicaid-services-hospital-franchise-fee.yml) and
  [the HIC fee](./medicaid-services-hic-fee.yml) carry nodes with fifteen years of figures each.
  Summing the five line items' *nodes* gives $17.66B in FY2014 and $37.22B in FY2026 —
  **+110.7% nominal and +49.2% real**, to the digit the same as the reconciliation computed
  directly from the workbooks above. [verified]

  That agreement is the check, not a coincidence. The two paths share only the source: one reads
  the spreadsheet columns and sums them, the other passes every figure through node creation,
  YAML, the money parser and the deflator. A units error anywhere in the second would show up
  here as a total that does not match, and on the first attempt it did — every seeded figure was
  a hundredfold too small, because the extraction printed dollars and the generator stored them
  as cents. Nothing in the node text looked wrong; `$9,389,075.75` is a plausible line item. The
  total was what failed.

  [open] The three dedicated-purpose lines carry no `draws-from` edge and their funds are
  unmodelled, so the corpus can say what they appropriate and not where the money comes from.
