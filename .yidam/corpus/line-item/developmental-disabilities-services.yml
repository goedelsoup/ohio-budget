class: line-item
label: Developmental Disabilities Medicaid Services
description: |
  Medicaid waiver services for Ohioans with developmental disabilities, appropriated to
  the [Department of Developmental Disabilities](../agency/developmental-disabilities.yml)
  rather than to the Department of Medicaid. [inference]

  Seeded to make concrete a fact that otherwise stays in prose: Medicaid spending is spread
  across several agencies, so a Medicaid total assembled from one department's line items is
  incomplete. Anyone summing "the Medicaid line items" without this one — and its behavioral
  health equivalent, not yet seeded — will understate the program.

  [open] The code, and the full set of agencies holding Medicaid-funded line items, are
  unverified.

  ## Candidates, and why none is committed

  The Department of Developmental Disabilities carries at least six Medicaid-related lines in
  the committed workbooks — **322407** `Medicaid State Match`, **322416** and **322604**
  `Medicaid Waiver - State Match` under two different fund groups, **322624** `County Board
  Waiver Match`, **322619** `Medicaid Repayment`, and others. [verified] Several appear only in
  the older biennia.

  This node describes "Medicaid waiver services delivered through county boards", which is
  plausibly **322624** or **322604** and plausibly the sum of several. Assigning one would be a
  guess presented as a code.

  [open] Whether this node should be one line item or a programme spanning several — the same
  question [foundation funding](./foundation-funding.yml) turned out to have.

