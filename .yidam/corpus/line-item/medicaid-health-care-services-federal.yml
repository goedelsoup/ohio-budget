class: line-item
label: Medicaid Health Care Services (Federal Share)
description: |
  The federal-fund-group counterpart to
  [Medicaid Health Care Services](./medicaid-health-care-services.yml), carrying the share of
  benefit payments reimbursed by the [federal match](../revenue-source/federal-medicaid-match.yml).
  [inference]

  This node makes the all-funds versus state-share distinction structural. The two line items
  fund the same benefits to the same people; one draws on the general revenue fund and one on
  federal money, and quoting either alone as "the Medicaid appropriation" is defensible only if
  you say which. Most public discussion does not.

  It also localizes a risk. A change in the federal match rate moves the split between these two
  line items without changing the total cost of the program or requiring any Ohio decision.

  [open] The code and the state/federal split by period are unverified.
