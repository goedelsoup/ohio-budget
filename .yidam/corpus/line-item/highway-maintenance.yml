class: line-item
label: Highway Maintenance
description: |
  Routine maintenance of the state highway system — resurfacing, snow and ice control,
  bridge inspection. [inference]

  Seeded alongside [highway construction](./highway-construction.yml) because the split between
  building and maintaining is the substance of most transportation budget argument, and a single
  transportation line item cannot represent it. Deferred maintenance is also the clearest case in
  the corpus of an obligation that does not appear as one: reducing this line produces a saving
  now and a larger cost later, and nothing in an appropriation document records the second.

  [open] The code and the maintenance-versus-construction split are unreconstructed.
