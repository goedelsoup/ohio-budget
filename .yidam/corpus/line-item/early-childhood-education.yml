class: line-item
label: Early Childhood Education
description: |
  State-funded preschool for eligible children, administered separately from the school
  funding formula. [inference]

  Seeded as a genuinely discretionary education appropriation — its size is a legislative choice
  rather than a formula result, unlike [foundation funding](./foundation-funding.yml) or
  [pupil transportation](./pupil-transportation.yml). That makes it the right control case when
  reading a change in education spending: a formula line and a discretionary line moving
  together mean something different from either moving alone.

  [open] The code, eligibility thresholds, and served population are unreconstructed.

  ## ALI 200408, zeroed in FY2024 — and an actual that should not exist

  **ALI 200408, `Early Childhood Education`, agency EDU, general revenue fund.** [verified]
  The name matches five different line items across five agencies — EDU/GRF 200408, EDU/FED
  200661, OSB/DPF 226402, JFS/DPF 600696 and KID/GRF 830407 — so the code was chosen on the
  node's own definition (state-funded preschool, general revenue) rather than on the name, which
  identifies nothing.

  The series runs $23.3M in FY2012 to $68.1M from FY2018, and then **$0.00 from FY2024 onward**.
  ALI 830407, `Early Childhood Education` under the new Department of Children and Youth, is
  enacted at $130.3M in FY2024. [verified] The shape is the same as
  [the Medicaid agency transfer](./medicaid-services-odjfs.yml): a line item zeroed while a
  successor under a new agency takes the programme.

  **The FY2024 actual is $112,723,608.72 against an appropriation of $0.00, and the other half
  has been found.** [verified] ALI 830407 under the new agency is appropriated $130,316,000 that
  year and reports **$0.00** spent. So the authority moved and the disbursement did not: $112.7M
  is 86% of the successor's appropriation and 165% of anything this line item ever carried, which
  rules out the education department simply spending an old budget.

  The two halves are now linked by a `superseded-by` edge, and
  [the gap calculator](../../../crates/gap/) names the counterpart on both rather than reporting
  one as an overspend and the other as a programme that did nothing. When this figure first
  arrived it was reported as a nought-percent variance, because the percentage defaulted to zero
  when authority was zero.

  [open] Which of the two rows the state's own accounting treats as authoritative, and whether
  FY2025 repeats it. No committed source carries FY2025 actuals for either code.

