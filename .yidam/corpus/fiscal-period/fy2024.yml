class: fiscal-period
label: Fiscal Year 2024
description: |
  The state fiscal year running 2023-07-01 through 2024-06-30.

  Seeded because financial reporting closes annually while appropriation is biennial,
  so an actual-closed figure belongs to a year even when the authority behind it was
  granted for two.
