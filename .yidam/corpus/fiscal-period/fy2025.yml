class: fiscal-period
label: Fiscal Year 2025
description: |
  The state fiscal year running 2024-07-01 through 2025-06-30.

  Seeded when the corpus moved its appropriation nodes from biennium labels to fiscal years.
  Ohio's sources state a figure for each year of a biennium and never for the biennium itself,
  so a node labelled FY2024-25 was a shape no document supported — see
  [period-granularity](../../decisions/period-granularity.yml).

  [open] FY2025 closed on 2025-06-30 but no committed source carries its actuals. The HB 33
  workbook was published as of 2024-09-30 and reports FY2025 as an *adjusted appropriation*,
  which is authority and not spending. A later edition would close this.
properties:
  label: FY2025
  period_type: fiscal-year
  start_date: 2024-07-01
  end_date: 2025-06-30
  general_assembly: 135th
links:
  - target: ../fiscal-period.ont.yml
    relationship: instance-of
  - target: ./fy2024-25.yml
    relationship: contained-by
