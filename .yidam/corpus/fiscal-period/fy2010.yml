class: fiscal-period
label: Fiscal Year 2010
description: |
  The state fiscal year running 2009-07-01 through 2010-06-30.

  The corpus's earliest annual figure. FY2011 has no annual node and will not get one from
  this source family: HB 153's workbook reports FY2010 as an actual and FY2011 only as an
  **estimate**, and no later workbook reaches back that far. An estimate is somebody's
  projection and is never an actual, so the year stays absent rather than being filled with the
  nearest available number.

  **FY2010 carries actuals and no appropriations, and never will.** An LSC workbook appropriates
  one biennium and reports two completed years beside it, so the earliest committed document
  reaches two years further back in outturn than in authority. Supplying FY2010 appropriations
  would need the 128th General Assembly's workbook, and the 128th published none — only
  greenbooks and per-agency comparison PDFs. Twelve appropriated-against-actual pairs are blocked
  on this and are permanently blocked. [verified]
