class: fiscal-period
label: Fiscal Year 2015
description: |
  The state fiscal year running 2014-07-01 through 2015-06-30.

  Seeded when the 130th General Assembly's budget workbook was committed and the FY2014-15
  appropriations were split per year, per
  [period-granularity](../../decisions/period-granularity.yml).

  Splitting these was not tidying. A biennial label cannot be restated in constant dollars —
  the price index is keyed by single fiscal year, and averaging two into one is a modelling
  decision nobody has taken — so every figure carried under one was outside the reach of
  [the deflator](../../decisions/nominal-growth-is-mostly-price-level.yml).

  [open] No committed source carries FY2015 actuals.
properties:
  label: FY2015
  period_type: fiscal-year
  start_date: 2014-07-01
  end_date: 2015-06-30
  general_assembly: 130th
links:
  - target: ../fiscal-period.ont.yml
    relationship: instance-of
  - target: ./fy2014-15.yml
    relationship: contained-by
