class: expenditure
label: Foundation Funding (7017) — FY2024, Actual
description: |
  $1,274,945,000.00 charged against line item 200612 in FY2024. [verified]

  **Exactly the appropriation, to the cent.** Where the
  [general revenue line](./foundation-funding-fy2024-actual.yml) overspent its authority by
  $7,753,596.89, this one and its sibling matched theirs precisely.

  That asymmetry is the explanation for the corpus's only computed gap, and it is a property of
  how the programme is funded rather than of how it was managed. The non-general-revenue sources
  contribute fixed amounts into a formula-driven distribution; the general revenue line absorbs
  whatever the formula produces. [inference] So the entire $7,753,596.89 of programme-level
  variance lands on GRF, and reading it as a general revenue overspend attributes to one fund a
  movement that belongs to the programme.
