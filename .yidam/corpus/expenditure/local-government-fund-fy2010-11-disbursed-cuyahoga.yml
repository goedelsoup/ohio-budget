class: expenditure
label: Local Government Fund Disbursement to Cuyahoga County — FY2010-11
description: |
  Local government fund money received by
  [Cuyahoga County](../jurisdiction/cuyahoga-county.yml) before the share was reduced.

  The *before* half of the corpus's only recipient-level pair. Differenced against the
  [FY2012-13 figure](./local-government-fund-fy2012-13-disbursed-cuyahoga.yml) it gives the
  reduction a number attached to a named place — which is the form in which a fiscal decision
  becomes legible to the people it affected.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
