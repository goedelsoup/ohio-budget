class: expenditure
label: Medicaid Health Care Services — FY2024-25 Actual
description: |
  General revenue Medicaid benefit spending for the closed FY2024-25 biennium.

  Paired with [what was appropriated](../appropriation/medicaid-health-care-services-fy2024-25-as-enacted.yml),
  this is the corpus's second complete gap case and the one that must be read most carefully.
  Because Medicaid cost follows enrollment and federal match rather than legislative choice, a
  divergence here is evidence about how well caseload was forecast — not about whether the
  department spent responsibly. The same number on a discretionary line would mean something
  else entirely.
