class: expenditure
label: Foundation Funding — FY2024 Actual
description: |
  School funding actually disbursed in FY2024. $7,975,003,596.89. [verified]

  The first closed-book actual in this corpus, and the figure that makes its central question
  answerable for one line item: set against
  [what HB 33 appropriated](../appropriation/foundation-funding-fy2024-as-enacted.yml),
  spending exceeded enacted authority by $7,753,596.89 — about a tenth of one percent.

  The sign is the interesting part. A gap is usually discussed as authority left unspent, and
  this one runs the other way. Enacted authority was not the operative limit by year end,
  which means something in the execution phase moved it: a controlling board action, a
  supplemental, or a transfer. [inference] The corpus can now pose that question precisely,
  and cannot yet answer it — no execution-phase action for this line item is extracted.

  Note also that this figure is reported by the Legislative Service Commission rather than by
  the Office of Budget and Management. Two authorities publish actuals and they need not
  agree; the [`obm`](../../crates/obm/) connector remains unbuilt, so no cross-check exists.
  [open]
