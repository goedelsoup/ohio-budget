class: expenditure
label: Medicaid Health Care Services — FY2020-21 Actual
description: |
  Medicaid general revenue spending in the pandemic biennium.

  Enrollment rose sharply while federal match terms changed, so both sides of the state's
  obligation moved at once. [inference] Read against the
  [appropriation](../appropriation/medicaid-health-care-services-fy2020-21-as-enacted.yml), the
  divergence here is the strongest available evidence about caseload forecasting under stress —
  and the weakest available evidence about anything else.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
