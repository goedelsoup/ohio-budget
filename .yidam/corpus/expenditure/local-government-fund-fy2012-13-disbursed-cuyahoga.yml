class: expenditure
label: Local Government Fund Disbursement to Cuyahoga County — FY2012-13
description: |
  Local government fund money received by
  [Cuyahoga County](../jurisdiction/cuyahoga-county.yml) in the biennium the share was reduced.
  [inference]

  This is where the corpus's local finance thread reaches a specific recipient. The chain runs
  from a statutory percentage changed in [HB 153](../bill/hb153-129th.yml), through a
  [reduced appropriation](../appropriation/local-government-fund-distribution-fy2012-13-as-enacted.yml),
  to money a named county did not receive — and every hop is a node that can be checked
  separately.

  [open] The county's receipts before and after are unextracted. That pair, more than any
  statewide total, is what makes the reduction legible as something that happened to somewhere.
