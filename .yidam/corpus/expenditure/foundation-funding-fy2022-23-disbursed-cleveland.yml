class: expenditure
label: Foundation Funding Disbursement to Cleveland Metropolitan Schools — FY2022-23
description: |
  Foundation funding paid to
  [Cleveland Metropolitan School District](../jurisdiction/cleveland-metropolitan-school-district.yml)
  during the first biennium of the Fair School Funding Plan phase-in. [inference]

  The second district-level disbursement in the corpus. Paired with the
  [Columbus figure](./foundation-funding-fy2024-disbursed.yml) it makes district comparison
  possible for the first time — but the two cover different biennia, so they are not yet
  directly comparable. Closing that requires either district seeded for both periods.

  The same caveat applies as to any district figure: this is a slice of the line item, not the
  line item, and differencing it against the full appropriation is wrong by orders of
  magnitude.
  This node is still labelled by biennium, which the corpus no longer does for figures. It is
  staged rather than overlooked: no source is committed for this period, and splitting an empty
  node yields two empty nodes. It is converted when a source arrives. See
  [period-granularity](../../decisions/period-granularity.yml).
