class: expenditure
label: Institutional Operations — FY2024-25 Actual
description: |
  Prison operating spending for the closed FY2024-25 biennium, with authority that lapsed
  unspent at period end.

  This is the corpus's first instance of the approved `expenditure →[reverts-to]→ fund` edge.
  Reversion is the mechanism by which a gap between appropriated and actual resolves without
  anyone deciding anything: unspent authority simply lapses back to the
  [general revenue fund](../fund/general-revenue-fund.yml) and is available again.

  Modeling it matters because reversion and underspending look identical in a two-number
  comparison, and they are not the same event.

  [open] Both the disbursed figure and the reverted amount are unextracted.
