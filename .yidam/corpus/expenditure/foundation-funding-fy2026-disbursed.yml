class: expenditure
label: Foundation Funding — FY2026 Disbursed
description: |
  In-year foundation funding disbursement for the open FY2026 year.

  The corpus's only expenditure on a `disbursed` rather than `actual-closed` basis, and it is
  seeded to make the distinction impossible to overlook. Any gap computed against this figure is
  provisional — the year has not closed, the books will move, and a chart drawn from it today
  will not match one drawn after closing.

  [`gap`](../../skills/gap.md) must refuse to mix this with closed figures, which is why `basis`
  is a required property rather than a note.
