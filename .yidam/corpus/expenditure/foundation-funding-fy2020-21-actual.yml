class: expenditure
label: Foundation Funding — FY2020-21 Actual
description: |
  School funding actually disbursed in the pandemic biennium.

  Paired with [what HB 166 appropriated](../appropriation/foundation-funding-fy2020-21-as-enacted.yml),
  this is the corpus's most interesting and least interpretable gap. Schools closed, enrollment
  counts moved, federal relief arrived outside the state appropriation, and an executive
  reduction cut mid-year. [inference] Four mechanisms, one number.

  It is seeded precisely because it is the case where a naive reading of `gap` output would be
  most confidently wrong.
