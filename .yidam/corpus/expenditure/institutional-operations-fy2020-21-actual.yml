class: expenditure
label: Institutional Operations — FY2020-21 Actual
description: |
  Prison operating spending in the pandemic biennium, with authority lapsing unspent.

  The control case for the period. Corrections costs follow a population that did not respond to
  the pandemic on the same timescale as Medicaid enrollment or school attendance, [inference] so
  a divergence here is more likely to reflect execution than forecasting.

  It is the corpus's second reversion, which makes reversion a pattern rather than a one-off and
  gives [`gap`](../../skills/gap.md) a second case for its reversion rate.
