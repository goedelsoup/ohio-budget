# mise.toml — task and toolchain entry point for this yidam-derived repository.
#
# The yidam CLI tasks (yidam-build, regen, graph-check, bundle, …) live in
# mise.yidam.toml, copied to the repo root by `yidam overlay` during bootstrap.
# Overlay refuses to run against a repository that already has .yidam/, so
# nothing re-syncs that file in place today. Treat it as vendored anyway and
# edit this one, so a future refresh finds nothing here to clobber.
#
# mise has no config-level `extends`/`include`, so mise.yidam.toml is wired in
# as a config fragment: .config/mise/conf.d/yidam.toml symlinks to it. mise
# auto-loads conf.d fragments, so `mise tasks` and `mise run <task>` see the
# yidam tasks with no MISE_ENV needed. Keep repo-specific tools and tasks here.

[tools]
rust = { version = "1.88.0", components = "rustfmt,clippy" }
# The web layer's runtime. Declared here rather than left to whatever the machine has,
# because CI runs the same `mise run ci` this file defines, and a toolchain named in two
# places is a toolchain that drifts in one of them.
node = "24"

# Override. mise.yidam.toml ships `cargo install --path yidam/cli`, but the
# bootstrap vendor step moves yidam/ to .yidam/.vendor/, so that path is dead in
# every bootstrapped repo. Overridden here rather than edited there so the fix
# is not lost if that file is ever refreshed, and because repo-specific tasks
# belong in this file regardless.
[tasks.yidam-build]
description = "Compile and install the yidam binary from the vendored CLI to ~/.cargo/bin."
run = "cargo install --path .yidam/.vendor/cli"

# ── domain computer (crates/) ─────────────────────────────────────────────

[tasks.build]
description = "Build the domain computer."
run = "cargo build --workspace --manifest-path crates/Cargo.toml"

[tasks.test]
description = "Run domain computer tests."
run = "cargo test --workspace --manifest-path crates/Cargo.toml"

[tasks.fmt]
description = "Format the domain computer."
run = "cargo fmt --all --manifest-path crates/Cargo.toml"

[tasks.lint]
description = "Clippy across the domain computer."
run = "cargo clippy --workspace --manifest-path crates/Cargo.toml -- -D warnings"

# ── corpus validation ─────────────────────────────────────────────────────

[tasks.schemas]
description = "Regenerate .yidam/schemas/ from the Rust types in crates/corpus-schema."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin emit-schemas -- .yidam/schemas"

[tasks.promote]
description = "Report what an extraction run would change in the corpus. Writes nothing."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin corpus-promote -- ."

[tasks.lineage]
description = "Propose line item succession candidates for review. Writes nothing."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin lineage -- ."

[tasks.gap]
description = "Report which appropriated-vs-actual gaps are computable, and what blocks the rest."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin gap-report -- ."

[tasks.stage-delta]
description = "Decompose appropriation movement across bill stages and attribute each step."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin stage-delta -- ."

[tasks.validate]
description = "Check corpus instances against their class definitions. Exits non-zero on errors."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin corpus-validate -- ."

# ── web interface (web/) ──────────────────────────────────────────────────
# The site renders the corpus and the calculators' output; it computes nothing
# itself. `export` is the seam: it runs the calculators and writes their verdicts
# to web/src/data/*.json, which is generated and gitignored. A second committed
# copy of the corpus is exactly the contradiction the gate exists to catch, so
# the web build depends on this task rather than on checked-in data.

[tasks.export]
description = "Emit the corpus and the calculators' results as JSON for the web layer."
run = "cargo run -q --manifest-path crates/Cargo.toml --bin corpus-export -- ."

[tasks.web-install]
description = "Install the web layer's dependencies."
dir = "web"
run = "npm install"

# `npm install` is free to rewrite the lockfile, and different npm versions disagree about
# what belongs in it — node 24's drops the `libc` hints node 26's writes, so whichever
# machine ran last wins and the diff flips back and forth. CI has no business editing the
# lockfile at all, so it installs from the lockfile instead of resolving against it.
[tasks.web-install-locked]
description = "Install the web layer's dependencies exactly as the lockfile states."
dir = "web"
run = "npm ci"

[tasks.web-dev]
description = "Serve the web interface with live reload."
depends = ["export"]
dir = "web"
run = "npm run dev"

[tasks.web-build]
description = "Build the static site into web/dist."
depends = ["export"]
dir = "web"
run = "npm run build"

[tasks.web-test]
description = "Run the web layer's unit tests."
dir = "web"
run = "npm run test"

[tasks.web-check]
description = "Typecheck the web layer."
dir = "web"
run = "npm run check"

# ── gate ──────────────────────────────────────────────────────────────────
# `validate` catches what `yidam graph-check` cannot: relationships an instance
# asserts that its class never declared. Both run; they check different things.

# .yidam/.vendor/ is not authored here and, since it was marked vendored, its diffs
# arrive collapsed in pull request review — which hides precisely the edit worth
# seeing. Nothing else looks for one: there is no commit hook, and no upstream pin
# to compare against. So compare against ourselves. `.yidam/.vendor.tree` holds the
# git tree hash of the directory, which is a content hash of the whole subtree, and
# an edit anywhere under it moves that hash.
#
# This reads HEAD rather than the working tree: the gate is the pull request, and a
# pull request's edits are committed. It also means the check needs no base ref and
# no history, which matters because the workflow checks out shallow.
[tasks.vendor-check]
description = "Fail if .yidam/.vendor/ has been edited away from its pinned tree hash."
run = '''
pinned=$(tr -d '[:space:]' < .yidam/.vendor.tree)
actual=$(git rev-parse HEAD:.yidam/.vendor)
if [ "$pinned" != "$actual" ]; then
  echo "error: .yidam/.vendor/ differs from the tree pinned in .yidam/.vendor.tree" >&2
  echo "  pinned:  $pinned" >&2
  echo "  at HEAD: $actual" >&2
  echo >&2
  echo "The vendor layer is template infrastructure, not written in this repository," >&2
  echo "and its diffs are collapsed in review. To see what moved:" >&2
  echo "    git diff $pinned $actual" >&2
  echo >&2
  echo "If the edit was an accident, drop the commit that made it:" >&2
  echo "    git log --oneline -- .yidam/.vendor/" >&2
  echo >&2
  echo "Do not try to restore from the pin directly. It is the hash of the subtree," >&2
  echo "so repo-relative paths do not resolve inside it, and the forms that look like" >&2
  echo "they should work delete the directory instead." >&2
  echo >&2
  echo "If the layer was refreshed on purpose, move the pin in the same commit:" >&2
  echo "    git rev-parse HEAD:.yidam/.vendor > .yidam/.vendor.tree" >&2
  exit 1
fi
echo "vendor layer matches its pin ($pinned)"
'''

[tasks.ci]
description = "Full gate: format, lint, test, validate the corpus, and check graph integrity."
run = [
  "cargo fmt --all --manifest-path crates/Cargo.toml -- --check",
  "cargo clippy --workspace --manifest-path crates/Cargo.toml -- -D warnings",
  "cargo test --workspace --manifest-path crates/Cargo.toml",
  "cargo test -p lsc --no-default-features --manifest-path crates/Cargo.toml",
  "cargo test -p governor --no-default-features --manifest-path crates/Cargo.toml",
  "cargo test -p obm --no-default-features --manifest-path crates/Cargo.toml",
  "cargo run -q --manifest-path crates/Cargo.toml --bin emit-schemas -- .yidam/schemas",
  "git diff --exit-code -- .yidam/schemas",
  "cargo run -q --manifest-path crates/Cargo.toml --bin corpus-validate -- .",
  "yidam graph-check",
  "mise run vendor-check",
  # The web layer's own gate. `web-build` depends on `export`, so a change to the
  # corpus or a calculator that the site cannot render fails here rather than at
  # deploy time.
  "mise run web-test",
  "mise run web-check",
  "mise run web-build",
]
