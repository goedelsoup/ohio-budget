[package]
name = "corpus-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Emits the corpus and the calculators' results as a versioned JSON feed for the web layer"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
walkdir.workspace = true
corpus-schema = { path = "../corpus-schema" }
real-dollars = { path = "../real-dollars" }
corpus-validate = { path = "../corpus-validate" }
gap = { path = "../gap" }
local-finance = { path = "../local-finance" }
lsc = { path = "../lsc", default-features = false }
stage-delta = { path = "../stage-delta" }

[[bin]]
name = "corpus-export"
path = "src/main.rs"
