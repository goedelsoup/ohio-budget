[package]
name = "stage-delta"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Decomposes an appropriation's movement across bill stages and attributes each step"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
corpus-schema = { path = "../corpus-schema" }
corpus-validate = { path = "../corpus-validate" }
lsc = { path = "../lsc", features = ["xlsx"] }

[[bin]]
name = "stage-delta"
path = "src/main.rs"

[[bin]]
name = "leadership"
path = "src/bin/leadership.rs"
