[workspace]
resolver = "2"
members = [
    "corpus-schema",
    "corpus-validate",
    "corpus-promote",
    "corpus-export",
    "legislature",
    "lsc",
    "real-dollars",
    "gap",
    "lineage",
    "stage-delta",
    "governor",
    "local-finance",
    "obm",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
walkdir = "2"
